<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Last Shop</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #20242b;
    overflow: hidden;
    color: #222;
}

/* =========================
   TOP BAR
========================= */

#topbar {
    height: 72px;
    background: #263b5a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 5px solid #b66d5d;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
}

#gameTitle {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1px;
}

#stats {
    display: flex;
    gap: 12px;
    align-items: center;
}

.stat {
    background: #18283f;
    padding: 10px 15px;
    border-radius: 10px;
    font-weight: bold;
    min-width: 95px;
    text-align: center;
}

#money {
    color: #ffe06a;
}

#combo {
    color: #ff9ed1;
}

#score {
    color: #8de5ff;
}

/* =========================
   GAME AREA
========================= */

#game {
    position: relative;
    height: calc(100vh - 72px);
    min-height: 650px;
    overflow: hidden;
    background:
        linear-gradient(#f8f4eb 0 34%, #f1d1c0 34% 35%, #eac7b5 35% 100%);
}

/* wall */

.wall {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 34%;
    background:
        linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        #f7f1e7;
    background-size: 55px 55px;
}

/* floor tiles */

.floor {
    position: absolute;
    top: 34%;
    bottom: 0;
    left: 0;
    right: 0;
    background:
        linear-gradient(90deg, rgba(130,80,70,.18) 1px, transparent 1px),
        linear-gradient(rgba(130,80,70,.18) 1px, transparent 1px),
        #e9c8b7;
    background-size: 48px 48px;
}

/* =========================
   SHOP SIGN
========================= */

.shopSign {
    position: absolute;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    background: #263b5a;
    color: #ffd66b;
    border: 4px solid #9d756b;
    padding: 12px 38px;
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 2px;
    z-index: 5;
    box-shadow: 0 5px 10px rgba(0,0,0,.25);
}

/* windows */

.window {
    position: absolute;
    top: 45px;
    width: 95px;
    height: 70px;
    background: #6cc8ff;
    border: 7px solid #725c58;
    z-index: 4;
}

.window:before,
.window:after {
    content: "";
    position: absolute;
    background: #725c58;
}

.window:before {
    width: 7px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
}

.window:after {
    height: 7px;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
}

.window.left {
    left: 70px;
}

.window.right {
    right: 70px;
}

/* =========================
   SHELVES
========================= */

.shelf {
    position: absolute;
    height: 105px;
    background: #a96654;
    border: 5px solid #704c49;
    border-radius: 6px;
    box-shadow: 0 8px 0 rgba(65,39,36,.25);
    z-index: 8;
}

.shelf.food {
    left: 7%;
    top: 55%;
    width: 38%;
}

.shelf.supplies {
    right: 7%;
    top: 55%;
    width: 38%;
}

.shelfTitle {
    position: absolute;
    top: -32px;
    left: 8px;
    font-size: 15px;
    font-weight: 900;
    color: #9b385c;
    background: #f6e9de;
    padding: 4px 8px;
    border-radius: 6px;
}

.products {
    display: flex;
    height: 100%;
    align-items: center;
    justify-content: space-around;
}

.product {
    width: 60px;
    height: 60px;
    border-radius: 9px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 31px;
    position: relative;
    box-shadow: 0 4px 7px rgba(0,0,0,.25);
}

.product span {
    position: absolute;
    bottom: -22px;
    background: #222;
    color: white;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 5px;
}

.soap {
    background: #65d9bc;
}

.bread {
    background: #ffd23d;
}

.milk {
    background: #70a9ed;
}

.apple {
    background: #ff5757;
}

.shampoo {
    background: #a78bfa;
}

.tools {
    background: #ff9e35;
}

/* =========================
   PLAYER
========================= */

#player {
    position: absolute;
    width: 58px;
    height: 85px;
    left: 50%;
    top: 27%;
    transform: translate(-50%, -50%);
    z-index: 30;
    transition: left .12s linear, top .12s linear;
}

.playerHead {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    margin: auto;
    overflow: hidden;
    border: 2px solid #333;
    background: #f0c2a0;
}

.playerHead img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.playerBody {
    width: 38px;
    height: 42px;
    background: #1476e8;
    border-radius: 8px 8px 5px 5px;
    margin: -1px auto 0;
    border: 2px solid #18539b;
}

/* =========================
   CUSTOMERS
========================= */

.customer {
    position: absolute;
    width: 75px;
    height: 115px;
    z-index: 20;
    transition: left .5s ease, top .5s ease;
}

.customerPhoto {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    overflow: hidden;
    margin: auto;
    border: 3px solid white;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
    background: #ddd;
}

.customerPhoto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.customerBody {
    width: 42px;
    height: 55px;
    margin: -2px auto 0;
    border-radius: 13px 13px 5px 5px;
    border: 2px solid rgba(0,0,0,.25);
}

.customerName {
    background: white;
    padding: 3px 7px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    text-align: center;
    margin-top: 3px;
    box-shadow: 0 2px 5px rgba(0,0,0,.2);
}

/* =========================
   ORDER POPUP
========================= */

#orders {
    position: absolute;
    right: 18px;
    bottom: 18px;
    width: 320px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.order {
    background: rgba(255,255,255,.97);
    border-radius: 17px;
    padding: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    border: 2px solid #ddd;
    animation: orderIn .3s ease;
}

@keyframes orderIn {
    from {
        opacity: 0;
        transform: translateX(40px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.orderTop {
    display: flex;
    align-items: center;
    gap: 10px;
}

.orderPhoto {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    object-fit: cover;
}

.orderName {
    font-weight: 900;
    font-size: 17px;
}

.orderText {
    margin-top: 7px;
    font-size: 14px;
}

.serveButton {
    width: 100%;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    padding: 10px;
    background: #20cf69;
    color: white;
    font-weight: 900;
    cursor: pointer;
    font-size: 14px;
}

.serveButton:hover {
    background: #12ae54;
}

/* =========================
   BOTTOM CONTROLS
========================= */

#controls {
    position: absolute;
    left: 20px;
    bottom: 18px;
    z-index: 90;
    display: flex;
    gap: 8px;
}

.controlButton {
    border: none;
    background: #263b5a;
    color: white;
    padding: 11px 15px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,.3);
}

.controlButton:hover {
    background: #36577f;
}

/* =========================
   MESSAGE
========================= */

#message {
    position: absolute;
    left: 50%;
    top: 15%;
    transform: translateX(-50%);
    z-index: 200;
    background: #263b5a;
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 900;
    opacity: 0;
    pointer-events: none;
}

#message.show {
    animation: messageAnim 1.8s ease forwards;
}

@keyframes messageAnim {
    0% {
        opacity: 0;
        transform: translate(-50%, -10px);
    }
    15% {
        opacity: 1;
        transform: translate(-50%, 0);
    }
    75% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -15px);
    }
}

/* =========================
   UPGRADE PANEL
========================= */

#upgradePanel {
    position: absolute;
    left: 20px;
    top: 105px;
    width: 220px;
    background: rgba(255,255,255,.96);
    padding: 14px;
    border-radius: 14px;
    z-index: 100;
    box-shadow: 0 6px 15px rgba(0,0,0,.25);
}

#upgradePanel h3 {
    margin-bottom: 8px;
}

.upgrade {
    width: 100%;
    margin-top: 7px;
    border: 0;
    border-radius: 8px;
    padding: 9px;
    background: #eee;
    cursor: pointer;
    text-align: left;
}

.upgrade:hover {
    background: #ddd;
}

.upgrade strong {
    display: block;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 900px) {

    #topbar {
        height: 60px;
        padding: 0 10px;
    }

    #gameTitle {
        font-size: 17px;
    }

    .stat {
        min-width: auto;
        padding: 7px;
        font-size: 11px;
    }

    .window {
        display: none;
    }

    .shopSign {
        top: 18px;
        font-size: 16px;
        padding: 9px 20px;
    }

    #upgradePanel {
        display: none;
    }

    #orders {
        width: 260px;
        right: 8px;
        bottom: 8px;
    }

    #controls {
        left: 8px;
        bottom: 8px;
    }
}
</style>
</head>

<body>

<header id="topbar">

    <div id="gameTitle">
        🏪 THE LAST SHOP
    </div>

    <div id="stats">

        <div class="stat" id="money">
            💰 £0
        </div>

        <div class="stat" id="score">
            ⭐ 0
        </div>

        <div class="stat" id="combo">
            🔥 x0
        </div>

    </div>

</header>


<main id="game">

    <div class="wall"></div>
    <div class="floor"></div>

    <div class="shopSign">
        THE LAST SHOP
    </div>

    <div class="window left"></div>
    <div class="window right"></div>


    <!-- PLAYER -->

    <div id="player">

        <div class="playerHead">
            <img src="https://randomuser.me/api/portraits/men/32.jpg">
        </div>

        <div class="playerBody"></div>

    </div>


    <!-- FOOD SHELF -->

    <div class="shelf food">

        <div class="shelfTitle">
            🥫 FOOD
        </div>

        <div class="products">

            <div class="product apple">
                🍎
                <span>£2</span>
            </div>

            <div class="product bread">
                🍞
                <span>£3</span>
            </div>

            <div class="product milk">
                🥛
                <span>£3</span>
            </div>

        </div>

    </div>


    <!-- SUPPLIES SHELF -->

    <div class="shelf supplies">

        <div class="shelfTitle">
            🧰 SUPPLIES
        </div>

        <div class="products">

            <div class="product shampoo">
                🧴
                <span>£4</span>
            </div>

            <div class="product tools">
                🔨
                <span>£5</span>
            </div>

            <div class="product soap">
                🧼
                <span>£4</span>
            </div>

        </div>

    </div>


    <!-- UPGRADES -->

    <div id="upgradePanel">

        <h3>⚙️ SHOP UPGRADES</h3>

        <button class="upgrade" onclick="buyUpgrade('speed')">
            🏃 <strong>Faster Service</strong>
            <small id="speedPrice">£50</small>
        </button>

        <button class="upgrade" onclick="buyUpgrade('customers')">
            👥 <strong>More Customers</strong>
            <small id="customerPrice">£75</small>
        </button>

        <button class="upgrade" onclick="buyUpgrade('profit')">
            💰 <strong>Higher Profit</strong>
            <small id="profitPrice">£100</small>
        </button>

    </div>


    <!-- CUSTOMER ORDERS -->

    <div id="orders"></div>


    <!-- CONTROLS -->

    <div id="controls">

        <button class="controlButton" onclick="movePlayer('left')">
            ◀
        </button>

        <button class="controlButton" onclick="movePlayer('right')">
            ▶
        </button>

        <button class="controlButton" onclick="movePlayer('up')">
            ▲
        </button>

        <button class="controlButton" onclick="movePlayer('down')">
            ▼
        </button>

        <button class="controlButton" onclick="newGame()">
            🔄
        </button>

    </div>


    <div id="message"></div>

</main>


<script>

/* =========================================================
   THE LAST SHOP
   COMPLETE GAME ENGINE
========================================================= */


/* =========================
   GAME DATA
========================= */

let money = 0;
let score = 0;
let combo = 0;

let customerLevel = 1;
let profitLevel = 1;
let speedLevel = 1;

let customerCounter = 0;

let playerX = 50;
let playerY = 27;

let maxCustomers = 4;

let orders = [];

let gameRunning = true;


/* =========================
   REAL PEOPLE
========================= */

const people = [

    {
        name: "Tom",
        image: "https://randomuser.me/api/portraits/men/32.jpg",
        body: "#5976d8"
    },

    {
        name: "Sarah",
        image: "https://randomuser.me/api/portraits/women/44.jpg",
        body: "#d66c91"
    },

    {
        name: "Mike",
        image: "https://randomuser.me/api/portraits/men/45.jpg",
        body: "#58a878"
    },

    {
        name: "Emma",
        image: "https://randomuser.me/api/portraits/women/68.jpg",
        body: "#9a72d4"
    },

    {
        name: "James",
        image: "https://randomuser.me/api/portraits/men/75.jpg",
        body: "#d7834b"
    },

    {
        name: "Lucy",
        image: "https://randomuser.me/api/portraits/women/65.jpg",
        body: "#4aa8a0"
    },

    {
        name: "David",
        image: "https://randomuser.me/api/portraits/men/81.jpg",
        body: "#6b8cba"
    },

    {
        name: "Anna",
        image: "https://randomuser.me/api/portraits/women/33.jpg",
        body: "#c66b89"
    }

];


/* =========================
   PRODUCTS
========================= */

const products = [

    {
        name: "soap",
        label: "Soap",
        icon: "🧼",
        price: 4
    },

    {
        name: "apple",
        label: "Apple",
        icon: "🍎",
        price: 2
    },

    {
        name: "bread",
        label: "Bread",
        icon: "🍞",
        price: 3
    },

    {
        name: "milk",
        label: "Milk",
        icon: "🥛",
        price: 3
    },

    {
        name: "shampoo",
        label: "Shampoo",
        icon: "🧴",
        price: 4
    },

    {
        name: "tools",
        label: "Tools",
        icon: "🔨",
        price: 5
    }

];


/* =========================
   RANDOM PRODUCT
========================= */

function randomProduct() {

    return products[
        Math.floor(Math.random() * products.length)
    ];

}


/* =========================
   UPDATE HUD
========================= */

function updateHUD() {

    document.getElementById("money").innerHTML =
        "💰 £" + money.toFixed(0);

    document.getElementById("score").innerHTML =
        "⭐ " + score;

    document.getElementById("combo").innerHTML =
        "🔥 x" + combo;

}


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.classList.remove("show");

    void message.offsetWidth;

    message.classList.add("show");

}


/* =========================
   CREATE CUSTOMER
========================= */

function createCustomer() {

    if (!gameRunning) return;

    if (orders.length >= maxCustomers) return;


    const person =
        people[Math.floor(Math.random() * people.length)];

    const product =
        randomProduct();


    customerCounter++;


    const customer = {

        id: customerCounter,

        name: person.name,

        image: person.image,

        body: person.body,

        product: product,

        x: 10 + Math.random() * 80,

        y: 38 + Math.random() * 15

    };


    orders.push(customer);

    createCustomerCharacter(customer);

    createOrderCard(customer);

}


/* =========================
   CUSTOMER CHARACTER
========================= */

function createCustomerCharacter(customer) {

    const element =
        document.createElement("div");

    element.className = "customer";

    element.id =
        "customer-" + customer.id;

    element.style.left =
        customer.x + "%";

    element.style.top =
        customer.y + "%";


    element.innerHTML = `

        <div class="customerPhoto">

            <img src="${customer.image}"
                 alt="${customer.name}">

        </div>

        <div class="customerBody"
             style="background:${customer.body}">
        </div>

        <div class="customerName">
            ${customer.name}
        </div>

    `;


    document.getElementById("game")
        .appendChild(element);

}


/* =========================
   ORDER CARD
========================= */

function createOrderCard(customer) {

    const ordersContainer =
        document.getElementById("orders");


    const order =
        document.createElement("div");

    order.className = "order";

    order.id =
        "order-" + customer.id;


    order.innerHTML = `

        <div class="orderTop">

            <img class="orderPhoto"
                 src="${customer.image}">

            <div>

                <div class="orderName">
                    ${customer.name}
                </div>

                <small>
                    Customer
                </small>

            </div>

        </div>

        <div class="orderText">

            ${customer.product.icon}
            I need ${customer.product.label}!

        </div>

        <button class="serveButton"
                onclick="serveCustomer(${customer.id})">

            SERVE CUSTOMER

        </button>

    `;


    ordersContainer.appendChild(order);

}


/* =========================
   SERVE CUSTOMER
========================= */

function serveCustomer(id) {

    const index =
        orders.findIndex(c => c.id === id);

    if (index === -1) return;


    const customer =
        orders[index];


    /*
       Profit increases with upgrades.
    */

    const base =
        customer.product.price;

    const profit =
        base + (profitLevel - 1);


    money += profit;

    score += 10 * profitLevel;

    combo++;


    /*
       Move customer away.
    */

    const character =
        document.getElementById(
            "customer-" + id
        );


    if (character) {

        character.style.left = "105%";

        character.style.opacity = "0";

    }


    /*
       Remove order.
    */

    const order =
        document.getElementById(
            "order-" + id
        );


    if (order) {

        order.style.opacity = "0";

        order.style.transform =
            "translateX(50px)";

        setTimeout(() => {

            order.remove();

        }, 250);

    }


    orders.splice(index, 1);


    updateHUD();


    showMessage(
        "✅ Served " +
        customer.name +
        " +£" +
        profit
    );


    /*
       New customer soon.
    */

    setTimeout(() => {

        createCustomer();

    }, Math.max(
        700,
        2200 - speedLevel * 300
    ));

}


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(direction) {

    const step =
        5 + speedLevel;


    if (direction === "left") {

        playerX -= step;

    }

    if (direction === "right") {

        playerX += step;

    }

    if (direction === "up") {

        playerY -= step;

    }

    if (direction === "down") {

        playerY += step;

    }


    playerX =
        Math.max(4, Math.min(94, playerX));

    playerY =
        Math.max(12, Math.min(75, playerY));


    const player =
        document.getElementById("player");


    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a") {

            movePlayer("left");

        }

        if (event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d") {

            movePlayer("right");

        }

        if (event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w") {

            movePlayer("up");

        }

        if (event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s") {

            movePlayer("down");

        }

    }
);


/* =========================
   UPGRADES
========================= */

function buyUpgrade(type) {


    if (type === "speed") {

        const price =
            50 * speedLevel;


        if (money < price) {

            showMessage(
                "❌ You need £" + price
            );

            return;

        }


        money -= price;

        speedLevel++;


        document.getElementById(
            "speedPrice"
        ).innerText =
            "£" + (50 * speedLevel);


        showMessage(
            "🏃 Speed upgraded!"
        );

    }


    if (type === "customers") {

        const price =
            75 * customerLevel;


        if (money < price) {

            showMessage(
                "❌ You need £" + price
            );

            return;

        }


        money -= price;

        customerLevel++;

        maxCustomers++;


        document.getElementById(
            "customerPrice"
        ).innerText =
            "£" + (75 * customerLevel);


        showMessage(
            "👥 More customers unlocked!"
        );

    }


    if (type === "profit") {

        const price =
            100 * profitLevel;


        if (money < price) {

            showMessage(
                "❌ You need £" + price
            );

            return;

        }


        money -= price;

        profitLevel++;


        document.getElementById(
            "profitPrice"
        ).innerText =
            "£" + (100 * profitLevel);


        showMessage(
            "💰 Profit upgraded!"
        );

    }


    updateHUD();

}


/* =========================
   COMBO SYSTEM
========================= */

setInterval(function() {

    if (combo > 0) {

        combo--;

        updateHUD();

    }

}, 8000);


/* =========================
   CUSTOMER SPAWNER
========================= */

setInterval(function() {

    if (!gameRunning) return;

    if (orders.length < maxCustomers) {

        createCustomer();

    }

}, 3500);


/* =========================
   FIRST CUSTOMERS
========================= */

function startCustomers() {

    setTimeout(
        createCustomer,
        800
    );

    setTimeout(
        createCustomer,
        1800
    );

    setTimeout(
        createCustomer,
        3000
    );

}


/* =========================
   NEW GAME
========================= */

function newGame() {

    money = 0;

    score = 0;

    combo = 0;

    customerLevel = 1;

    profitLevel = 1;

    speedLevel = 1;

    maxCustomers = 4;

    playerX = 50;

    playerY = 27;


    orders.forEach(customer => {

        const element =
            document.getElementById(
                "customer-" + customer.id
            );

        if (element) {

            element.remove();

        }

    });


    orders = [];


    document.getElementById(
        "orders"
    ).innerHTML = "";


    document.getElementById(
        "speedPrice"
    ).innerText = "£50";


    document.getElementById(
        "customerPrice"
    ).innerText = "£75";


    document.getElementById(
        "profitPrice"
    ).innerText = "£100";


    document.getElementById(
        "player"
    ).style.left = "50%";


    document.getElementById(
        "player"
    ).style.top = "27%";


    updateHUD();


    showMessage(
        "🏪 New shop day started!"
    );


    startCustomers();

}


/* =========================
   START GAME
========================= */

updateHUD();

startCustomers();


/* =========================
   AUTO SAVE
========================= */

setInterval(function() {

    const saveData = {

        money,
        score,
        combo,
        customerLevel,
        profitLevel,
        speedLevel

    };

    localStorage.setItem(
        "lastShopSave",
        JSON.stringify(saveData)
    );

}, 5000);


/* =========================
   LOAD SAVE
========================= */

try {

    const saved =
        JSON.parse(
            localStorage.getItem(
                "lastShopSave"
            )
        );


    if (saved) {

        money =
            saved.money || 0;

        score =
            saved.score || 0;

        combo =
            saved.combo || 0;

        customerLevel =
            saved.customerLevel || 1;

        profitLevel =
            saved.profitLevel || 1;

        speedLevel =
            saved.speedLevel || 1;

        maxCustomers =
            3 + customerLevel;


        document.getElementById(
            "speedPrice"
        ).innerText =
            "£" + (50 * speedLevel);


        document.getElementById(
            "customerPrice"
        ).innerText =
            "£" + (75 * customerLevel);


        document.getElementById(
            "profitPrice"
        ).innerText =
            "£" + (100 * profitLevel);


        updateHUD();

    }

} catch(error) {

    console.log(
        "No previous save found."
    );

}

</script>

</body>
</html>
