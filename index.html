<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Last Shop — Endless Business Game</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#e9eef3;
color:#17202a;
overflow:hidden
}

button{
cursor:pointer;
border:0;
border-radius:8px;
padding:9px 12px;
font-weight:bold
}

.top{
height:64px;
background:#102033;
color:white;
display:flex;
align-items:center;
gap:8px;
padding:8px 12px;
position:relative;
z-index:20
}

.logo{
font-size:20px;
font-weight:900;
margin-right:8px
}

.stat{
background:#1e334b;
padding:7px 11px;
border-radius:8px
}

.stat small{
display:block;
color:#9fb0c2;
font-size:10px
}

.actions{
margin-left:auto;
display:flex;
gap:6px
}

.green{background:#16a34a;color:white}
.blue{background:#2563eb;color:white}
.gold{background:#f59e0b}
.dark{background:#334155;color:white}
.red{background:#dc2626;color:white}

#world{
height:calc(100vh - 64px);
overflow:auto;
padding:35px 30px;
background-color:#f3eee5;
background-image:
linear-gradient(#00000008 1px,transparent 1px),
linear-gradient(90deg,#00000008 1px,transparent 1px);
background-size:40px 40px
}

.road{
height:120px;
background:#4b5563;
border-top:5px solid #374151;
margin:70px -30px -35px;
position:relative
}

.road:after{
content:"";
position:absolute;
top:57px;
left:0;
right:0;
height:5px;
background:repeating-linear-gradient(
90deg,
#f7d33d 0 45px,
transparent 45px 85px
)
}

.plot{
display:inline-block;
vertical-align:top;
width:590px;
min-height:400px;
background:#d5bd9d;
border:3px solid #95623e;
border-radius:14px;
padding:18px;
margin:20px 35px 30px 10px;
box-shadow:0 8px 20px #0002
}

.shop{
background:#fff;
border:3px solid #74472d;
border-radius:10px;
padding:18px;
position:relative;
min-height:350px
}

.sign{
position:absolute;
top:-25px;
left:50%;
transform:translateX(-50%);
background:#f4c542;
border:3px solid #74472d;
padding:8px 22px;
border-radius:8px;
font-weight:900;
font-size:18px;
white-space:nowrap;
z-index:5
}

.floor{
height:310px;
background:#e7d6bd;
border-radius:6px;
position:relative;
overflow:hidden
}

.shelf{
position:absolute;
height:75px;
background:#8d5131;
border:3px solid #60341f;
border-radius:7px;
display:flex;
gap:12px;
padding:8px;
box-shadow:0 5px 0 #5c351f
}

.food{
left:25px;
top:30px;
width:300px
}

.tools{
right:20px;
top:30px;
width:205px
}

.extra{
left:25px;
bottom:22px;
width:350px
}

.item{
width:54px;
height:54px;
border-radius:9px;
background:white;
border:2px solid #bbb;
display:flex;
align-items:center;
justify-content:center;
font-size:29px;
position:relative
}

.item span{
position:absolute;
bottom:-16px;
background:#111827;
color:white;
font-size:10px;
border-radius:4px;
padding:2px 4px
}

.counter{
position:absolute;
left:50%;
bottom:22px;
transform:translateX(-50%);
width:270px;
height:65px;
background:#985a38;
border:4px solid #64361f;
border-radius:8px;
box-shadow:0 6px 0 #5c321e
}

/* PLAYER / CUSTOMERS */

.player{
position:absolute;
left:50%;
bottom:83px;
transform:translateX(-50%);
z-index:4;
text-align:center
}

.label{
background:white;
border:1px solid #bbb;
border-radius:6px;
padding:3px 7px;
font-weight:bold;
font-size:11px
}

.person{
width:58px;
height:90px;
position:relative;
margin:auto
}

.head{
position:absolute;
top:0;
left:13px;
width:32px;
height:32px;
border-radius:50%;
background:#d9a477;
border:2px solid #9b6746
}

.hair{
position:absolute;
top:-1px;
left:12px;
width:34px;
height:14px;
border-radius:17px 17px 7px 7px;
background:#39281f
}

.body{
position:absolute;
top:31px;
left:9px;
width:40px;
height:39px;
border-radius:11px;
background:#2563eb;
border:2px solid #17479f
}

.arm{
position:absolute;
top:35px;
width:10px;
height:34px;
background:#d9a477;
border-radius:7px
}

.al{
left:1px;
transform:rotate(12deg)
}

.ar{
right:1px;
transform:rotate(-12deg)
}

.leg{
position:absolute;
top:68px;
width:12px;
height:22px;
background:#202938;
border-radius:6px
}

.ll{left:17px}
.lr{right:17px}

.eye{
position:absolute;
top:13px;
width:4px;
height:4px;
background:#111;
border-radius:50%;
z-index:2
}

.el{left:21px}
.er{left:34px}

.mouth{
position:absolute;
left:23px;
top:22px;
width:12px;
height:6px;
border-bottom:2px solid #7c2d12;
border-radius:50%
}

.customer{
position:absolute;
z-index:8;
display:flex;
flex-direction:column;
align-items:center
}

.bubble{
background:white;
border:1px solid #cbd5e1;
border-radius:11px;
padding:8px;
width:155px;
box-shadow:0 5px 15px #0002;
font-size:12px
}

.bubble b{
font-size:13px
}

.need{
display:block;
color:#475569;
margin:4px 0
}

.serve{
width:100%;
background:#16a34a;
color:white;
font-size:11px;
padding:7px
}

/* SIDE PANEL */

#side{
position:fixed;
right:12px;
top:76px;
width:315px;
max-height:calc(100vh - 88px);
overflow:auto;
background:white;
border:1px solid #d5dbe3;
border-radius:14px;
box-shadow:0 8px 30px #0002;
z-index:30
}

.tabs{
display:flex;
position:sticky;
top:0;
background:white;
z-index:2
}

.tab{
flex:1;
background:white;
border-radius:0;
font-size:12px
}

.tab.active{
background:#eff6ff;
color:#1d4ed8
}

.panel{
padding:13px
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:8px 0;
border-bottom:1px solid #eee
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.card{
border:1px solid #ddd;
border-radius:9px;
padding:8px;
background:#fafafa
}

.notice{
background:#eff6ff;
border-left:4px solid #2563eb;
padding:9px;
border-radius:7px;
font-size:12px
}

.log{
max-height:180px;
overflow:auto;
font-size:12px
}

.log div{
padding:5px 0;
border-bottom:1px solid #eee
}

.toast{
position:fixed;
left:50%;
bottom:25px;
transform:translateX(-50%);
background:#111827;
color:white;
padding:11px 18px;
border-radius:9px;
z-index:100;
opacity:0;
transition:.2s
}

.toast.show{
opacity:1
}

@media(max-width:900px){

.logo{
display:none
}

.plot{
width:90vw
}

#side{
width:285px
}

}
</style>
</head>

<body>

<header class="top">

<div class="logo">
🏪 THE LAST SHOP
</div>

<div class="stat">
<b id="money">£650</b>
<small>Cash</small>
</div>

<div class="stat">
<b id="day">Day 1</b>
<small id="time">08:00</small>
</div>

<div class="stat">
<b id="served">0</b>
<small>Customers</small>
</div>

<div class="stat">
<b id="rep">25</b>
<small>Reputation</small>
</div>

<div class="actions">

<button class="gold" onclick="openShop()">
OPEN
</button>

<button class="dark" onclick="closeShop()">
CLOSE
</button>

<button class="blue" onclick="save()">
SAVE
</button>

<button onclick="help()">
HELP
</button>

</div>

</header>

<main id="world">

<div id="shops"></div>

<div class="road"></div>

</main>

<aside id="side">

<div class="tabs">

<button class="tab active" onclick="tab('business',this)">
Business
</button>

<button class="tab" onclick="tab('stock',this)">
Stock
</button>

<button class="tab" onclick="tab('staff',this)">
Staff
</button>

<button class="tab" onclick="tab('log',this)">
Log
</button>

</div>

<div id="business" class="panel"></div>

<div id="stock" class="panel" style="display:none"></div>

<div id="staff" class="panel" style="display:none"></div>

<div id="log" class="panel" style="display:none"></div>

</aside>

<div id="toast" class="toast"></div>

<script>

const ITEMS={

apple:{
n:"Apples",
i:"🍎",
buy:1.2,
sell:2.5
},

banana:{
n:"Bananas",
i:"🍌",
buy:.9,
sell:2.2
},

grapes:{
n:"Grapes",
i:"🍇",
buy:2.1,
sell:4.5
},

bread:{
n:"Fresh bread",
i:"🍞",
buy:1.1,
sell:2.8
},

milk:{
n:"Milk",
i:"🥛",
buy:.8,
sell:2.1
},

water:{
n:"Water",
i:"💧",
buy:.35,
sell:1.2
},

sandwich:{
n:"Sandwich",
i:"🥪",
buy:1.5,
sell:3.8
},

hammer:{
n:"Hammer",
i:"🔨",
buy:7,
sell:14
},

drill:{
n:"Power drill",
i:"🛠️",
buy:25,
sell:49
},

paint:{
n:"Paint",
i:"🎨",
buy:8,
sell:18
},

screws:{
n:"Screws",
i:"🔩",
buy:2,
sell:5
},

car:{
n:"Car",
i:"🚗",
buy:4200,
sell:5900
}

};

const names=[
"Tom",
"Lucy",
"David",
"Maria",
"Jack",
"Emma",
"Daniel",
"Sophie",
"Michael",
"Olivia",
"James",
"Amelia",
"Noah",
"Grace",
"George",
"Mia"
];

const colors=[
"#2563eb",
"#16a34a",
"#f97316",
"#9333ea",
"#0891b2",
"#dc2626",
"#ca8a04"
];

let S={

v:1,

money:650,

day:1,

min:480,

open:false,

served:0,

sales:0,

expenses:0,

rep:25,

next:1,

customers:[],

logs:[],

shops:[

{

id:1,

name:"Your Grocery Shop",

type:"grocery",

level:1,

staff:0,

stock:{

apple:8,

banana:8,

grapes:6,

bread:8,

milk:8,

water:10,

sandwich:5,

hammer:0,

drill:0,

paint:0,

screws:0,

car:0

}

}

]

};

const $=id=>document.getElementById(id);

const money=n=>

"£"+Math.max(0,n).toLocaleString(
"en-GB",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

function rnd(a,b){

return Math.floor(
Math.random()*(b-a+1)
)+a;

}

function log(x){

S.logs.unshift(

new Date().toLocaleTimeString(
"en-GB",
{
hour:"2-digit",
minute:"2-digit"
}
)
+" — "+x

);

S.logs=S.logs.slice(0,70);

}

function toast(x){

$("toast").textContent=x;

$("toast").classList.add("show");

setTimeout(
()=>$("toast").classList.remove("show"),
1700
);

}

function save(){

localStorage.setItem(
"lastShopEndless",
JSON.stringify(S)
);

toast("Saved ✓");

}

function load(){

try{

let x=JSON.parse(
localStorage.getItem("lastShopEndless")
);

if(x&&x.v===1)S=x;

}catch(e){}

}

function avatar(color){

return `

<div class="person">

<div class="head"></div>

<div class="hair"></div>

<i class="eye el"></i>

<i class="eye er"></i>

<i class="mouth"></i>

<div class="body"
style="background:${color}">
</div>

<i class="arm al"></i>

<i class="arm ar"></i>

<i class="leg ll"></i>

<i class="leg lr"></i>

</div>

`;

}

function stockTotal(sh){

return Object.values(sh.stock)
.reduce(
(a,b)=>a+b,
0
);

}

function item(sh,id){

return `

<div class="item">

${ITEMS[id].i}

<span>
${sh.stock[id]||0}
</span>

</div>

`;

}

function render(){

renderWorld();

business();

stock();

staff();

logs();

top();

}

function renderWorld(){

let h="";

S.shops.forEach(sh=>{

h+=`

<section class="plot">

<div class="shop">

<div class="sign">
${sh.name}
</div>

<div class="floor">

<div class="shelf food">

${["apple","banana","grapes","bread"]
.map(x=>item(sh,x))
.join("")}

</div>

<div class="shelf tools">

${["hammer","paint","screws"]
.map(x=>item(sh,x))
.join("")}

</div>

<div class="shelf extra">

${["milk","water","sandwich"]
.map(x=>item(sh,x))
.join("")}

</div>

<div class="counter">
</div>

<div class="player">

${avatar("#2563eb")}

<div class="label">
You — behind the counter
</div>

</div>

${S.customers
.filter(c=>c.shopId===sh.id)
.map(customer)
.join("")}

</div>

</div>

</section>

`;

});

$("shops").innerHTML=h;

}

function customer(c){

return `

<div class="customer"
style="left:${c.x}%;top:${c.y}%">

${avatar(c.color)}

<div class="bubble">

<b>${c.name}</b>

<span class="need">

${ITEMS[c.need].i}

I need ${ITEMS[c.need].n.toLowerCase()}

</span>

<button
class="serve"
onclick="serve(${c.id})">

SERVE CUSTOMER

</button>

</div>

</div>

`;

}

function top(){

$("money").textContent=money(S.money);

$("day").textContent="Day "+S.day;

$("time").textContent=clock();

$("served").textContent=S.served;

$("rep").textContent=S.rep;

}

function clock(){

return String(
Math.floor(S.min/60)%24
).padStart(2,"0")
+
":"+
String(S.min%60).padStart(2,"0");

}

function business(){

let sh=S.shops[0];

let up=Math.round(
350*Math.pow(
1.65,
sh.level-1
)
);

$("business").innerHTML=`

<h3>📈 Business</h3>

<div class="notice">

Start with one real shop.
Buy food and tools,
open the doors,
serve people,
restock from suppliers,
hire staff and reinvest
your profits.

There is no ending.

</div>

<div class="grid"
style="margin-top:9px">

<div class="card">

<b>${money(S.money)}</b>

<small>Cash</small>

</div>

<div class="card">

<b>Lv ${sh.level}</b>

<small>Shop</small>

</div>

<div class="card">

<b>${money(S.sales)}</b>

<small>Sales</small>

</div>

<div class="card">

<b>${stockTotal(sh)}</b>

<small>Stock</small>

</div>

</div>

<div class="row">

<span>Status</span>

<b>
${S.open?"🟢 OPEN":"🔴 CLOSED"}
</b>

</div>

<div class="row">

<span>Staff</span>

<b>${sh.staff}</b>

</div>

<button
class="green"
style="width:100%;margin-top:7px"
onclick="upgrade()">

Upgrade shop —
${money(up)}

</button>

<button
class="blue"
style="width:100%;margin-top:7px"
onclick="delivery()">

Order food delivery

</button>

<button
style="width:100%;margin-top:7px"
onclick="hire()">

Hire employee —
${money(120+sh.staff*70)}

</button>

<hr>

<h3>🏪 Next shop</h3>

${
S.shops.length<2

?

`

<p style="font-size:12px">

When you have £25,000,
buy the shop next door
and run a second business
selling cars.

</p>

<button
class="gold"
style="width:100%"
onclick="buyNext()">

BUY NEXT SHOP — £25,000

</button>

`

:

`

<div class="card">

<b>🚗 Last Motors</b>

<small>

Level ${S.shops[1].level}
· Staff ${S.shops[1].staff}
· Cars ${S.shops[1].stock.car}

</small>

</div>

<button
style="width:100%;margin-top:7px"
onclick="buyCar()">

Buy car —
${money(ITEMS.car.buy)}

</button>

<button
class="green"
style="width:100%;margin-top:7px"
onclick="sellCar()">

Sell car
+${money(ITEMS.car.sell)}

</button>

`

}

`;

}

function stock(){

let sh=S.shops[0];

$("stock").innerHTML=

"<h3>📦 Suppliers</h3>"+

"<p style='font-size:12px'>"+
"Buy stock here, then open the shop. "+
"Every sale removes one item from your shelves."+
"</p>"+

Object.entries(ITEMS)

.filter(([id])=>id!=="car")

.map(([id,x])=>`

<div class="row">

<span>

${x.i} ${x.n}

<br>

<small>
Buy ${money(x.buy)}
· Sell ${money(x.sell)}
</small>

</span>

<span>

<b>${sh.stock[id]||0}</b>

<br>

<button
onclick="buy('${id}',5)">

+5

</button>

</span>

</div>

`)

.join("");

}

function staff(){

let sh=S.shops[0];

$("staff").innerHTML=`

<h3>👷 Staff</h3>

<div class="notice">

Employees automatically serve
customers while you manage
the business.

</div>

<div class="row">

<span>Employees</span>

<b>${sh.staff}</b>

</div>

<button
class="green"
style="width:100%"
onclick="hire()">

Hire employee —
${money(120+sh.staff*70)}

</button>

<p style="font-size:12px;margin-top:12px">

Your character stays behind
the counter and can serve
customers manually.

</p>

`;

}

function logs(){

$("log").innerHTML=

"<h3>🧾 Activity</h3>"+

"<div class='log'>"+

(

S.logs
.map(x=>"<div>"+x+"</div>")
.join("")

||

"<div>No activity.</div>"

)

+"</div>";

}

function tab(id,b){

document
.querySelectorAll(".panel")
.forEach(
x=>x.style.display="none"
);

$(id).style.display="block";

document
.querySelectorAll(".tab")
.forEach(
x=>x.classList.remove("active")
);

b.classList.add("active");

}

function openShop(){

if(stockTotal(S.shops[0])<1){

toast("Buy stock first.");

return;

}

S.open=true;

log("Shop opened.");

toast("SHOP OPEN 🟢");

render();

}

function closeShop(){

S.open=false;

S.customers=[];

log("Shop closed.");

toast("Shop closed.");

render();

}

function buy(id,q){

let cost=ITEMS[id].buy*q;

if(S.money<cost){

toast("Not enough money.");

return;

}

S.money-=cost;

S.expenses+=cost;

S.shops[0].stock[id]+=q;

log(
"Bought "+
q+
" × "+
ITEMS[id].n+
" for "+
money(cost)
);

render();

}

function delivery(){

let ids=[
"apple",
"banana",
"grapes",
"bread",
"milk",
"water",
"sandwich"
];

let cost=0;

ids.forEach(
id=>cost+=ITEMS[id].buy*6
);

if(S.money<cost){

toast("Not enough money.");

return;

}

S.money-=cost;

S.expenses+=cost;

ids.forEach(
id=>S.shops[0].stock[id]+=6
);

log("Supplier delivery arrived.");

render();

}

function upgrade(){

let sh=S.shops[0];

let cost=Math.round(
350*Math.pow(
1.65,
sh.level-1
)
);

if(S.money<cost){

toast("Not enough money.");

return;

}

S.money-=cost;

S.expenses+=cost;

sh.level++;

S.rep=Math.min(
100,
S.rep+3
);

log(
"Shop upgraded to level "+
sh.level
);

toast("Shop upgraded!");

render();

}

function hire(){

let sh=S.shops[0];

let cost=120+sh.staff*70;

if(S.money<cost){

toast("Not enough money.");

return;

}

S.money-=cost;

S.expenses+=cost;

sh.staff++;

log(
"Hired employee #"+
sh.staff
);

render();

}

function buyNext(){

if(S.shops.length>1){

toast("Already owned.");

return;

}

if(S.money<25000){

toast("You need £25,000.");

return;

}

S.money-=25000;

S.expenses+=25000;

S.shops.push({

id:2,

name:"Last Motors",

type:"car",

level:1,

staff:0,

stock:{

apple:0,
banana:0,
grapes:0,
bread:0,
milk:0,
water:0,
sandwich:0,
hammer:0,
drill:0,
paint:0,
screws:0,
car:2

}

});

log(
"Bought the shop next door: Last Motors."
);

toast("NEW SHOP 🚗");

render();

}

function buyCar(){

let sh=S.shops[1];

if(!sh)return;

if(S.money<ITEMS.car.buy){

toast("Not enough money.");

return;

}

S.money-=ITEMS.car.buy;

S.expenses+=ITEMS.car.buy;

sh.stock.car++;

log(
"Bought a car for the dealership."
);

render();

}

function sellCar(){

let sh=S.shops[1];

if(
!sh||
sh.stock.car<1
){

toast("No car in stock.");

return;

}

sh.stock.car--;

S.money+=ITEMS.car.sell;

S.sales+=ITEMS.car.sell;

S.served++;

log(
"Sold a car for "+
money(ITEMS.car.sell)
);

toast(
"CAR SOLD +"+
money(ITEMS.car.sell)
);

render();

}

function addCustomer(){

if(
!S.open||
S.customers.length>=7
)return;

let sh=S.shops[0];

let ids=Object.keys(ITEMS)
.filter(
id=>
id!=="car"&&
sh.stock[id]>0
);

if(!ids.length)return;

let need=
ids[
rnd(0,ids.length-1)
];

S.customers.push({

id:++S.next,

name:names[
rnd(0,names.length-1)
],

need,

x:rnd(3,86),

y:rnd(5,53),

color:colors[
rnd(0,colors.length-1)
],

shopId:1

});

log(
"Customer arrived wanting "+
ITEMS[need].n+
"."
);

render();

}

function serve(id){

let c=S.customers.find(
x=>x.id===id
);

if(!c)return;

let sh=S.shops[0];

if(sh.stock[c.need]<1){

toast("Out of stock.");

return;

}

sh.stock[c.need]--;

S.money+=ITEMS[c.need].sell;

S.sales+=ITEMS[c.need].sell;

S.served++;

S.rep=Math.max(
0,
Math.min(
100,
S.rep+
(Math.random()<.88?1:-1)
)
);

S.customers=
S.customers.filter(
x=>x.id!==id
);

log(
"Served "+
c.name+
" — "+
ITEMS[c.need].n+
" for "+
money(ITEMS[c.need].sell)
);

toast(
"Sale +"+
money(ITEMS[c.need].sell)
);

render();

}

function autoServe(){

if(!S.open)return;

let sh=S.shops[0];

let cs=
S.customers.slice(
0,
sh.staff
);

cs.forEach(
(c,i)=>
setTimeout(
()=>serve(c.id),
250+i*250
)
);

}

function tick(){

S.min++;

if(S.min>=1440){

S.min=420;

S.day++;

S.open=false;

S.customers=[];

let wages=
S.shops.reduce(
(a,s)=>a+s.staff*35,
0
);

if(wages){

S.money-=wages;

S.expenses+=wages;

log(
"Daily wages paid: "+
money(wages)
);

}

log(
"Day "+
S.day+
" started. The business continues."
);

}

if(
S.open&&
Math.random()<.55
)addCustomer();

if(
S.open&&
S.min%4===0
)autoServe();

top();

if(
S.min%5===0
)localStorage.setItem(
"lastShopEndless",
JSON.stringify(S)
);

}

function help(){

alert(

"THE LAST SHOP\n\n"+

"Start with £650.\n\n"+

"Buy food and tools.\n\n"+

"Open the shop and serve customers.\n\n"+

"Restock using supplier deliveries.\n\n"+

"Hire employees to serve automatically.\n\n"+

"Upgrade the shop.\n\n"+

"When you reach £25,000, buy the shop next door and start the car dealership.\n\n"+

"There is no ending: the days continue forever.\n\n"+

"Your save is stored in this browser."

);

}

load();

if(!S.logs.length)

log(
"Welcome! You own your first shop and have £650."
);

render();

setInterval(
tick,
1000
);

setInterval(
()=>{
if(S.open)addCustomer()
},
4500
);

document.addEventListener(
"keydown",
e=>{

if(e.key.toLowerCase()==="o")
openShop();

if(e.key.toLowerCase()==="c")
closeShop();

if(e.key.toLowerCase()==="s")
save();

}
);

</script>

</body>
</html>
