<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Learn & Play</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(135deg,#eef4ff,#f8f5ff);
 color:#17213c;
}

header{
 background:linear-gradient(135deg,#2563eb,#4f46e5,#7c3aed);
 color:white;
 padding:30px 15px;
 text-align:center;
 box-shadow:0 8px 30px #0002;
}

header h1{
 margin:0;
 font-size:42px;
}

header p{
 margin:10px 0 20px;
 opacity:.9;
}

.tabs button{
 border:0;
 padding:13px 22px;
 margin:5px;
 border-radius:30px;
 background:#ffffff25;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

.tabs button.active{
 background:white;
 color:#263c9e;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:30px 15px 60px;
}

.stats{
 display:flex;
 gap:12px;
 flex-wrap:wrap;
 margin-bottom:25px;
}

.stat{
 background:white;
 padding:12px 18px;
 border-radius:16px;
 box-shadow:0 8px 25px #17213c15;
 font-weight:bold;
}

.games{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:20px;
}

.game{
 background:white;
 border-radius:25px;
 padding:22px;
 box-shadow:0 12px 35px #17213c18;
 transition:.2s;
}

.game:hover{
 transform:translateY(-6px);
}

.game-icon{
 font-size:55px;
}

.game h3{
 font-size:21px;
 margin:10px 0 6px;
}

.game p{
 color:#66708a;
 min-height:45px;
}

.play{
 width:100%;
 border:0;
 padding:14px;
 border-radius:14px;
 background:linear-gradient(135deg,#2563eb,#4f46e5);
 color:white;
 font-weight:bold;
 font-size:16px;
 cursor:pointer;
}

.play:hover{
 opacity:.9;
}

.hidden{
 display:none;
}

.adults{
 display:none;
}

.adultHero{
 background:linear-gradient(135deg,#172554,#2563eb);
 color:white;
 border-radius:28px;
 padding:35px;
 margin-bottom:25px;
 box-shadow:0 15px 40px #17213c25;
}

.adultHero h2{
 font-size:32px;
 margin-top:0;
}

.adultGrid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:20px;
}

.lesson{
 background:white;
 padding:22px;
 border-radius:25px;
 box-shadow:0 12px 35px #17213c18;
}

.lessonIcon{
 font-size:55px;
}

.lesson h3{
 font-size:22px;
}

.lesson p{
 color:#66708a;
 line-height:1.5;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#07102dcc;
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal.show{
 display:flex;
}

.modalBox{
 background:white;
 width:min(850px,100%);
 max-height:92vh;
 overflow:auto;
 border-radius:28px;
}

.modalHeader{
 background:linear-gradient(135deg,#2563eb,#4f46e5);
 color:white;
 padding:18px 22px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.modalHeader h2{
 margin:0;
}

.close{
 border:0;
 background:white;
 color:#17213c;
 width:40px;
 height:40px;
 border-radius:50%;
 font-size:22px;
 font-weight:bold;
 cursor:pointer;
}

.modalBody{
 padding:25px;
}

.question{
 font-size:30px;
 text-align:center;
 font-weight:bold;
 margin:25px 0;
}

.answers{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}

.answer{
 border:0;
 padding:18px;
 border-radius:16px;
 background:#eef2ff;
 font-size:20px;
 font-weight:bold;
 cursor:pointer;
}

.answer:hover{
 background:#dbeafe;
}

.correct{
 background:#dcfce7!important;
}

.wrong{
 background:#fee2e2!important;
}

.feedback{
 text-align:center;
 font-size:20px;
 font-weight:bold;
 min-height:35px;
 margin:15px;
}

.progress{
 height:12px;
 background:#e5e7eb;
 border-radius:20px;
 overflow:hidden;
}

.progressBar{
 height:100%;
 background:linear-gradient(90deg,#22c55e,#2563eb);
 width:0%;
}

.memory{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 max-width:500px;
 margin:auto;
}

.memory button{
 aspect-ratio:1;
 border:0;
 border-radius:15px;
 background:linear-gradient(135deg,#2563eb,#7c3aed);
 color:transparent;
 font-size:32px;
 cursor:pointer;
}

.memory button.open,
.memory button.matched{
 background:#f8fafc;
 color:#17213c;
}

.lessonPlayer{
 background:#0f172a;
 color:white;
 border-radius:22px;
 overflow:hidden;
}

.lessonScreen{
 min-height:330px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:40px;
 background:
 radial-gradient(circle at 20% 20%,#2563eb88,transparent 35%),
 linear-gradient(135deg,#0f172a,#1e1b4b);
}

.lessonScreen .big{
 font-size:75px;
}

.lessonScreen h2{
 font-size:32px;
}

.lessonScreen p{
 max-width:650px;
 font-size:19px;
 line-height:1.6;
 color:#dbeafe;
}

.controls{
 padding:15px;
 display:flex;
 gap:10px;
 align-items:center;
 flex-wrap:wrap;
}

.controls button{
 border:0;
 padding:11px 16px;
 border-radius:12px;
 background:#334155;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

.lessonProgress{
 height:7px;
 background:#334155;
}

.lessonProgress div{
 height:100%;
 background:#60a5fa;
 width:0%;
}

.quizBox{
 margin-top:20px;
 padding:20px;
 background:#eef2ff;
 border-radius:20px;
}

.quizBox button{
 border:0;
 background:white;
 padding:12px 16px;
 margin:5px;
 border-radius:12px;
 font-weight:bold;
 cursor:pointer;
}

@media(max-width:600px){
 header h1{font-size:32px}
 .answers{grid-template-columns:1fr}
 .question{font-size:23px}
 .memory{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<header>

<h1>🎓 Learn & Play</h1>

<p>
Fun educational games for kids and practical learning for adults
</p>

<div class="tabs">

<button id="kidsButton"
class="active"
onclick="showKids()">
🎮 Kids Games
</button>

<button id="adultButton"
onclick="showAdults()">
📚 Learning for Adults
</button>

</div>

</header>

<div class="container">

<!-- ================= KIDS ================= -->

<section id="kidsSection">

<h2>🎮 Kids Game Zone</h2>

<div class="stats">

<div class="stat">
⭐ Stars: <span id="stars">0</span>
</div>

<div class="stat">
🔥 Streak: <span id="streak">0</span>
</div>

<div class="stat">
🏆 Level: <span id="level">1</span>
</div>

</div>

<div class="games" id="games"></div>

</section>


<!-- ================= ADULTS ================= -->

<section id="adultSection" class="adults">

<div class="adultHero">

<h2>📚 Learning for Adults</h2>

<p>
Learn useful skills through short lessons, interactive activities,
audio and quizzes.
</p>

</div>

<div class="adultGrid" id="adultGrid"></div>

</section>

</div>


<!-- ================= GAME MODAL ================= -->

<div class="modal" id="gameModal">

<div class="modalBox">

<div class="modalHeader">

<h2 id="gameTitle"></h2>

<button class="close" onclick="closeGame()">×</button>

</div>

<div class="modalBody" id="gameBody"></div>

</div>

</div>


<!-- ================= LESSON MODAL ================= -->

<div class="modal" id="lessonModal">

<div class="modalBox">

<div class="modalHeader">

<h2 id="lessonTitle"></h2>

<button class="close" onclick="closeLesson()">×</button>

</div>

<div class="modalBody" id="lessonBody"></div>

</div>

</div>


<script>

/* =========================================================
   SAVE PLAYER DATA
========================================================= */

let stars=Number(localStorage.getItem("stars")||0);
let streak=Number(localStorage.getItem("streak")||0);
let level=Number(localStorage.getItem("level")||1);

function save(){

 localStorage.setItem("stars",stars);
 localStorage.setItem("streak",streak);

 level=Math.max(1,Math.floor(stars/20)+1);

 localStorage.setItem("level",level);

 document.getElementById("stars").textContent=stars;
 document.getElementById("streak").textContent=streak;
 document.getElementById("level").textContent=level;
}


/* =========================================================
   NAVIGATION
========================================================= */

function showKids(){

 document.getElementById("kidsSection").style.display="block";
 document.getElementById("adultSection").style.display="none";

 document.getElementById("kidsButton").classList.add("active");
 document.getElementById("adultButton").classList.remove("active");

}

function showAdults(){

 document.getElementById("kidsSection").style.display="none";
 document.getElementById("adultSection").style.display="block";

 document.getElementById("kidsButton").classList.remove("active");
 document.getElementById("adultButton").classList.add("active");

}


/* =========================================================
   20 GAMES
========================================================= */

const games=[

["🏎️","Number Race","Race to the correct number","number"],
["🧠","Memory Match","Remember and match the cards","memory"],
["🔤","Word Scramble","Unscramble the hidden word","scramble"],
["🐝","Spelling Bee","Choose the correctly spelled word","spelling"],
["🚀","Math Blaster","Solve maths to launch the rocket","math"],
["🔷","Shape Hunt","Find the requested shape","shape"],
["🎨","Colour Mix","Learn how colours combine","colour"],
["🧩","Pattern Master","Find what comes next","pattern"],
["🔎","Odd One Out","Find what does not belong","odd"],
["➕","Addition Adventure","Solve addition challenges","addition"],
["➖","Subtraction Sprint","Solve subtraction challenges","subtraction"],
["✖️","Multiplication Mission","Master multiplication","multiplication"],
["➗","Division Dash","Solve division challenges","division"],
["💷","Money Master","Learn money and change","money"],
["🍕","Fraction Frenzy","Learn fractions","fraction"],
["⏰","Time Detective","Learn to read time","time"],
["🌍","Geography Explorer","Explore countries and capitals","geography"],
["🧪","Science Lab","Learn basic science","science"],
["⌨️","Typing Challenge","Build typing skills","typing"],
["🕵️","Logic Detective","Solve logic puzzles","logic"]

];


function renderGames(){

 const container=document.getElementById("games");

 container.innerHTML="";

 games.forEach((g,i)=>{

  const div=document.createElement("div");

  div.className="game";

  div.innerHTML=`

  <div class="game-icon">${g[0]}</div>

  <h3>${i+1}. ${g[1]}</h3>

  <p>${g[2]}</p>

  <button class="play" onclick="startGame(${i})">
  ▶ Play Game
  </button>

  `;

  container.appendChild(div);

 });

}


/* =========================================================
   RANDOM HELPERS
========================================================= */

function random(min,max){

 return Math.floor(Math.random()*(max-min+1))+min;

}

function shuffle(array){

 return array.sort(()=>Math.random()-0.5);

}

function options(correct,amount=4){

 let arr=[correct];

 while(arr.length<amount){

  let n=random(
   Math.max(0,Number(correct)-10),
   Number(correct)+10
  );

  if(!arr.includes(n)) arr.push(n);

 }

 return shuffle(arr);

}


/* =========================================================
   GAME ENGINE
========================================================= */

let currentGame=0;
let round=0;
let score=0;
let correctAnswer="";
let memoryData=null;


function startGame(index){

 currentGame=index;
 round=0;
 score=0;

 document.getElementById("gameModal").classList.add("show");

 document.getElementById("gameTitle").textContent=
 games[index][0]+" "+games[index][1];

 nextQuestion();

}


function closeGame(){

 document.getElementById("gameModal").classList.remove("show");

}


/* =========================================================
   QUESTIONS
========================================================= */

function nextQuestion(){

 if(round>=8){

  finishGame();
  return;

 }

 const type=games[currentGame][3];

 if(type==="memory"){

  if(round===0){

   createMemory();

  }

  return;

 }


 let question="";
 let correct="";
 let answers=[];


/* NUMBER */

 if(type==="number"){

  correct=random(1,20);

  question="🏎️ Choose number "+correct;

  answers=options(correct);

 }


/* SCRAMBLE */

 if(type==="scramble"){

  const words=[
   "APPLE",
   "ROCKET",
   "PLANET",
   "GARDEN",
   "SCHOOL",
   "BANANA"
  ];

  let word=words[random(0,words.length-1)];

  correct=word;

  question=
  "🔤 Unscramble: <b>"+
  shuffle(word.split("")).join(" ")+
  "</b>";

  answers=shuffle(words);

 }


/* SPELLING */

 if(type==="spelling"){

  const sets=[

  ["BEAUTIFUL",["BEAUTIFUL","BEATIFUL","BEAUTIFULL","BEUTIFUL"]],

  ["FRIEND",["FRIEND","FREIND","FRND","FREEND"]],

  ["SCHOOL",["SCHOOL","SCool","SCHOL","SHCOOL"]],

  ["BECAUSE",["BECAUSE","BECOUSE","BECASUE","BECAUS"]]

  ];

  let set=sets[round%sets.length];

  correct=set[0];

  question="🐝 Which word is spelled correctly?";

  answers=shuffle(set[1]);

 }


/* MATH */

 if(type==="math"){

  let a=random(2,12);
  let b=random(2,12);

  correct=a*b;

  question=`🚀 ${a} × ${b} = ?`;

  answers=options(correct);

 }


/* SHAPE */

 if(type==="shape"){

  const shapes=[

   ["⭐","star"],
   ["🔵","circle"],
   ["🟥","square"],
   ["🔺","triangle"]

  ];

  let s=shapes[round%shapes.length];

  correct=s[0];

  question="🔷 Find the "+s[1];

  answers=shuffle(shapes.map(x=>x[0]));

 }


/* COLOUR */

 if(type==="colour"){

  const q=[

   ["🔴 + 🔵","PURPLE"],
   ["🔵 + 🟡","GREEN"],
   ["🔴 + 🟡","ORANGE"]

  ];

  let x=q[round%q.length];

  correct=x[1];

  question="🎨 What colour do these make? "+x[0];

  answers=shuffle([
   "PURPLE",
   "GREEN",
   "ORANGE",
   "BLUE"
  ]);

 }


/* PATTERN */

 if(type==="pattern"){

  let start=random(1,5);
  let add=random(2,5);

  let a=start;
  let b=a+add;
  let c=b+add;
  let d=c+add;

  correct=d+add;

  question=`🧩 ${a} → ${b} → ${c} → ${d} → ?`;

  answers=options(correct);

 }


/* ODD */

 if(type==="odd"){

  if(round%2===0){

   answers=shuffle(["🐶","🐶","🐶","🚗"]);

   correct="🚗";

  }else{

   answers=shuffle(["🍎","🍎","🚗","🍎"]);

   correct="🚗";

  }

  question="🔎 Which one is different?";

 }


/* ADDITION */

 if(type==="addition"){

  let a=random(5,40);
  let b=random(1,30);

  correct=a+b;

  question=`➕ ${a} + ${b} = ?`;

  answers=options(correct);

 }


/* SUBTRACTION */

 if(type==="subtraction"){

  let a=random(20,60);
  let b=random(1,a);

  correct=a-b;

  question=`➖ ${a} − ${b} = ?`;

  answers=options(correct);

 }


/* MULTIPLICATION */

 if(type==="multiplication"){

  let a=random(2,12);
  let b=random(2,12);

  correct=a*b;

  question=`✖️ ${a} × ${b} = ?`;

  answers=options(correct);

 }


/* DIVISION */

 if(type==="division"){

  let b=random(2,10);
  let answer=random(2,10);

  let a=b*answer;

  correct=answer;

  question=`➗ ${a} ÷ ${b} = ?`;

  answers=options(correct);

 }


/* MONEY */

 if(type==="money"){

  let price=[2.50,4,7.50,9][round%4];

  let paid=price<5?10:20;

  correct=(paid-price).toFixed(2);

  question=
  `💷 A £${price.toFixed(2)} item is paid with £${paid}. What is the change?`;

  answers=shuffle([

   "£"+correct,
   "£1.00",
   "£3.50",
   "£8.00"

  ]);

 }


/* FRACTION */

 if(type==="fraction"){

  let data=[

   ["½","one half"],
   ["¼","one quarter"],
   ["¾","three quarters"],
   ["⅓","one third"]

  ][round%4];

  correct=data[0];

  question="🍕 Which symbol means "+data[1]+"?";

  answers=shuffle(["½","¼","¾","⅓"]);

 }


/* TIME */

 if(type==="time"){

  let hour=[3,6,9,12][round%4];

  correct=hour+":00";

  question=
  `⏰ The clock shows ${hour} o'clock. What time is it?`;

  answers=shuffle([

   hour+":00",
   ((hour+1-1)%12+1)+":00",
   ((hour+2-1)%12+1)+":00",
   ((hour+3-1)%12+1)+":00"

  ]);

 }


/* GEOGRAPHY */

 if(type==="geography"){

  let data=[

   ["What is the capital of France?","Paris",
   ["Paris","Madrid","Rome","London"]],

   ["What is the capital of Japan?","Tokyo",
   ["Tokyo","Seoul","Beijing","Osaka"]],

   ["Which is a continent?","Africa",
   ["Africa","London","Nile","Amazon"]],

   ["The Eiffel Tower is in which country?","France",
   ["France","Italy","Spain","Germany"]]

  ][round%4];

  question="🌍 "+data[0];

  correct=data[1];

  answers=shuffle(data[2]);

 }


/* SCIENCE */

 if(type==="science"){

  let data=[

   ["What do plants need for photosynthesis?","Light",
   ["Light","Plastic","Metal","Sound"]],

   ["Which planet has famous rings?","Saturn",
   ["Saturn","Mars","Earth","Mercury"]],

   ["At what temperature does water freeze?","0°C",
   ["0°C","50°C","100°C","-50°C"]],

   ["What gas do humans mainly breathe?","Oxygen",
   ["Oxygen","Gold","Iron","Helium"]]

  ][round%4];

  question="🧪 "+data[0];

  correct=data[1];

  answers=shuffle(data[2]);

 }


/* TYPING */

 if(type==="typing"){

  let words=[
   "APPLE",
   "ROCKET",
   "PLANET",
   "SCHOOL",
   "GARDEN"
  ];

  correct=words[round%words.length];

  correctAnswer=correct;

  document.getElementById("gameBody").innerHTML=`

   <div class="question">
   ⌨️ Type this word
   <br><br>
   <b>${correct}</b>
   </div>

   <input id="typingInput"
   style="display:block;width:100%;padding:15px;font-size:22px;border:3px solid #c7d2fe;border-radius:15px"
   autofocus>

   <br>

   <button class="play" onclick="checkTyping()">
   Submit Answer
   </button>

   <div class="feedback" id="feedback"></div>

  `;

  return;

 }


/* LOGIC */

 if(type==="logic"){

  let data=[

   ["I have keys but no locks. What am I?",
   "KEYBOARD",
   ["KEYBOARD","HOUSE","SHOE","BOTTLE"]],

   ["What comes next: 2, 4, 8, 16, ?",
   "32",
   ["32","20","24","30"]],

   ["Which is heavier: 1kg of iron or 500g of iron?",
   "1KG OF IRON",
   ["1KG OF IRON","500G OF IRON","100G OF GOLD","10G OF PAPER"]]

  ][round%3];

  question="🕵️ "+data[0];

  correct=data[1];

  answers=shuffle(data[2]);

 }


correctAnswer=String(correct);

document.getElementById("gameBody").innerHTML=`

<div>

<div class="progress">
<div class="progressBar"
style="width:${round/8*100}%"></div>
</div>

<div class="question">
${question}
</div>

<div class="answers">

${answers.map(answer=>`

<button class="answer"
onclick="answerQuestion(this,'${String(answer).replace(/'/g,"\\'")}')">

${answer}

</button>

`).join("")}

</div>

<div class="feedback" id="feedback"></div>

</div>

`;

}


/* =========================================================
   ANSWER
========================================================= */

function answerQuestion(button,value){

 const buttons=document.querySelectorAll(".answer");

 buttons.forEach(b=>b.disabled=true);

 let feedback=document.getElementById("feedback");

 if(String(value)===String(correctAnswer)){

  button.classList.add("correct");

  feedback.textContent="🎉 Correct! +1 ⭐";

  score++;
  stars++;
  streak++;

 }else{

  button.classList.add("wrong");

  feedback.textContent=
  "❌ Not quite. Correct answer: "+correctAnswer;

  streak=0;

 }

 save();

 round++;

 setTimeout(nextQuestion,900);

}


/* =========================================================
   TYPING
========================================================= */

function checkTyping(){

 let input=
 document.getElementById("typingInput").value
 .trim()
 .toUpperCase();

 let feedback=document.getElementById("feedback");

 if(input===correctAnswer){

  feedback.textContent="🎉 Excellent! +1 ⭐";

  score++;
  stars++;
  streak++;

 }else{

  feedback.textContent=
  "❌ Try again. The word is "+correctAnswer;

  streak=0;

 }

 save();

 round++;

 setTimeout(nextQuestion,900);

}


/* =========================================================
   MEMORY GAME
========================================================= */

function createMemory(){

 let symbols=[
  "🍎","🚀","🐶","⭐",
  "🎸","🍕","⚽","🦁"
 ];

 let cards=shuffle([...symbols,...symbols]);

 memoryData={
  cards:cards,
  opened:[],
  matched:[]
 };

 document.getElementById("gameBody").innerHTML=`

 <div class="question">
 🧠 Match all the pairs!
 </div>

 <div class="memory">

 ${cards.map((x,i)=>`

 <button
 id="memory${i}"
 onclick="flipMemory(${i})">
 ${x}
 </button>

 `).join("")}

 </div>

 <div class="feedback" id="memoryFeedback">
 Find all 8 pairs!
 </div>

 `;

}


function flipMemory(index){

 if(
 memoryData.opened.includes(index) ||
 memoryData.matched.includes(index)
 ) return;

 memoryData.opened.push(index);

 document
 .getElementById("memory"+index)
 .classList.add("open");

 if(memoryData.opened.length===2){

  let a=memoryData.opened[0];
  let b=memoryData.opened[1];

  if(memoryData.cards[a]===memoryData.cards[b]){

   memoryData.matched.push(a,b);

   document.getElementById("memory"+a)
   .classList.add("matched");

   document.getElementById("memory"+b)
   .classList.add("matched");

   memoryData.opened=[];

   stars++;
   score++;

   save();

   document.getElementById("memoryFeedback")
   .textContent="✨ Great match!";

   if(memoryData.matched.length===16){

    setTimeout(()=>{

     stars+=8;
     save();

     document.getElementById("gameBody").innerHTML=`

     <div class="question">
     🏆 MEMORY MASTER!
     </div>

     <p style="text-align:center;font-size:20px">
     You matched every pair!<br>
     ⭐ +8 bonus stars
     </p>

     <button class="play"
     onclick="startGame(${currentGame})">
     🔄 Play Again
     </button>

     `;

    },700);

   }

  }else{

   setTimeout(()=>{

    document
    .getElementById("memory"+a)
    .classList.remove("open");

    document
    .getElementById("memory"+b)
    .classList.remove("open");

    memoryData.opened=[];

   },700);

  }

 }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

 save();

 document.getElementById("gameBody").innerHTML=`

 <div style="text-align:center">

 <div style="font-size:80px">
 ${score>=6?"🏆":"⭐"}
 </div>

 <div class="question">
 Game Complete!
 </div>

 <p style="font-size:22px">
 You scored <b>${score}/8</b>
 </p>

 <p style="font-size:20px">
 ⭐ Stars earned: <b>${score}</b>
 </p>

 <button class="play"
 onclick="startGame(${currentGame})">
 🔄 Play Again
 </button>

 </div>

 `;

}

let currentLesson=0;
let currentSlide=0;
let lessonTimer=null;
let lessonPlaying=false;


function renderAdults(){

 let grid=document.getElementById("adultGrid");

 grid.innerHTML="";

 adultLessons.forEach((lesson,i)=>{

  let card=document.createElement("div");

  card.className="lesson";

  card.innerHTML=`

  <div class="lessonIcon">
  ${lesson.icon}

  onclick="openLesson(${i})">
  ▶ Start Lesson
  </button>

  `;

  grid.appendChild(card);

 });

}


/* =========================================================
   ADULT LESSON PLAYER
========================================================= */

function openLesson(index){

 currentLesson=index;
 currentSlide=0;
 lessonPlaying=false;

 document.getElementById("lessonModal")
 .classList.add("show");

 renderLesson();

}


function closeLesson(){

 clearInterval(lessonTimer);

 lessonPlaying=false;

 document.getElementById("lessonModal")
 .classList.remove("show");

}


function renderLesson(){

 let lesson=adultLessons[currentLesson];

 let slide=lesson.slides[currentSlide];

 let percent=
 ((currentSlide+1)/lesson.slides.length)*100;

 document.getElementById("lessonTitle").textContent=
 lesson.icon+" "+lesson.title;

 document.getElementById("lessonBody").innerHTML=`

 <div class="lessonPlayer">

 <div class="lessonScreen">

 <div>

 <div class="big">${slide[0]}</div>

 <h2>${slide[1]}</h2>

 <p>${slide[2]}</p>

 </div>

 </div>

 <div class="lessonProgress">
 <div style="width:${percent}%"></div>
 </div>

 <div class="controls">

 <button onclick="toggleLesson()">
 ${lessonPlaying?"⏸ Pause":"▶ Play"}
 </button>

 <button onclick="previousSlide()">
 ◀ Back
 </button>

 <button onclick="nextSlide()">
 Next ▶
 </button>

 <span style="margin-left:auto">
 ${currentSlide+1}/${lesson.slides.length}
 </span>

 </div>

 </div>


 <div style="
 margin-top:20px;
 padding:20px;
 background:#f8fafc;
 border-radius:20px">

 <h3>💡 What you should remember</h3>

 <p style="line-height:1.6">
 ${slide[2]}
 </p>

 <button
 onclick="speakLesson()"
 style="
 border:0;
 padding:12px 18px;
 border-radius:12px;
 background:#2563eb;
 color:white;
 font-weight:bold;
 cursor:pointer">

 🔊 Read Lesson Aloud

 </button>

 </div>


 ${
 currentSlide===lesson.slides.length-1
 ?

 `

 <div class="quizBox">

 <h3>🧠 Quick Check</h3>

 <p>
 <b>${lesson.quiz[0]}</b>
 </p>

 ${lesson.quiz[1].map((answer,i)=>`

 <button onclick="lessonQuiz(this,${i})">
 ${answer}
 </button>

 `).join("")}

 <div id="lessonFeedback"></div>

 </div>

 `

 : ""

 }

 `;

}


/* =========================================================
   ADULT VIDEO CONTROLS
========================================================= */

function toggleLesson(){

 lessonPlaying=!lessonPlaying;

 clearInterval(lessonTimer);

 if(lessonPlaying){

  lessonTimer=setInterval(()=>{

   if(
   currentSlide<
   adultLessons[currentLesson].slides.length-1
   ){

    currentSlide++;

    renderLesson();

   }else{

    lessonPlaying=false;

    clearInterval(lessonTimer);

    renderLesson();

   }

  },4000);

 }

 renderLesson();

}


function nextSlide(){

 currentSlide=Math.min(
 adultLessons[currentLesson].slides.length-1,
 currentSlide+1
 );

 renderLesson();

}


function previousSlide(){

 currentSlide=Math.max(0,currentSlide-1);

 renderLesson();

}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speakLesson(){

 let lesson=adultLessons[currentLesson];

 let slide=lesson.slides[currentSlide];

 if("speechSynthesis" in window){

  speechSynthesis.cancel();

  let speech=
  new SpeechSynthesisUtterance(
   slide[1]+". "+slide[2]
  );

  speech.rate=.95;

  speechSynthesis.speak(speech);

 }

}


/* =========================================================
   ADULT QUIZ
========================================================= */

function lessonQuiz(button,index){

 let lesson=adultLessons[currentLesson];

 let buttons=
 document.querySelectorAll(".quizBox button");

 buttons.forEach(b=>b.disabled=true);

 let feedback=
 document.getElementById("lessonFeedback");

 if(index===lesson.quiz[2]){

  button.style.background="#dcfce7";

  feedback.innerHTML=
  "<h3>🎉 Correct! Lesson completed.</h3>";

 }else{

  button.style.background="#fee2e2";

  feedback.innerHTML=
  "<h3>💡 Not quite. Review the lesson and try again.</h3>";

 }

}
