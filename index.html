<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Last Shop - Endless Life</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#111827;
    color:#fff;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#182b44;
}

/* ---------- SKY ---------- */
#sky{
    position:absolute;
    inset:0 0 43% 0;
    background:linear-gradient(#1672bd,#58b8ef);
    transition:.8s;
}

#moon{
    position:absolute;
    width:75px;
    height:75px;
    right:9%;
    top:8%;
    border-radius:50%;
    background:#fff4bd;
    box-shadow:0 0 30px #fff4bd;
}

.star{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff7bd;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.25}
    to{opacity:1}
}

/* ---------- CITY ---------- */
#city{
    position:absolute;
    left:0;
    right:0;
    top:18%;
    height:35%;
    display:flex;
    align-items:flex-end;
    gap:12px;
    padding:0 3%;
}

.building{
    position:relative;
    flex:1;
    min-width:70px;
    background:#173653;
    border:2px solid #234b6d;
}

.window{
    position:absolute;
    width:7px;
    height:9px;
    background:#ffe879;
    box-shadow:0 0 5px #ffe879;
}

/* ---------- ROAD ---------- */
#road{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:34%;
    background:#303947;
    border-top:8px solid #48505d;
}

.road-line{
    position:absolute;
    left:0;
    right:0;
    top:52%;
    height:5px;
    background:repeating-linear-gradient(
        90deg,
        #ffd83d 0 55px,
        transparent 55px 100px
    );
}

/* ---------- SHOP ---------- */
#shop{
    position:absolute;
    left:50%;
    top:34%;
    transform:translateX(-50%);
    width:min(560px,72vw);
    height:290px;
    background:#a96342;
    border:8px solid #693d35;
    border-radius:8px;
    box-shadow:0 20px 40px #0008;
    z-index:5;
}

.shop-roof{
    position:absolute;
    left:-8px;
    right:-8px;
    top:-42px;
    height:42px;
    background:repeating-linear-gradient(
        135deg,
        #e34d38 0 22px,
        #ff7548 22px 44px
    );
    border:6px solid #693d35;
}

.shop-sign{
    position:absolute;
    left:50%;
    top:-4px;
    transform:translate(-50%,-100%);
    background:#ffd84a;
    color:#5d351d;
    border:5px solid #693d35;
    border-radius:10px;
    padding:10px 35px;
    font-weight:900;
    font-size:24px;
    white-space:nowrap;
}

.shop-window{
    position:absolute;
    left:55px;
    top:50px;
    width:180px;
    height:115px;
    background:linear-gradient(#bdeaff,#e9fbff);
    border:8px solid #70483b;
}

.shop-window:after{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:5px;
    background:#70483b;
}

.shop-door{
    position:absolute;
    right:55px;
    bottom:0;
    width:105px;
    height:180px;
    background:#8b4e35;
    border:8px solid #633c31;
}

.shop-door:after{
    content:"";
    position:absolute;
    right:12px;
    top:50%;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ffd34d;
}

.shop-counter{
    position:absolute;
    left:35px;
    right:35px;
    bottom:25px;
    height:58px;
    background:#d58a42;
    border:5px solid #70412f;
}

/* ---------- HUD ---------- */
#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    z-index:100;
    pointer-events:none;
}

.hud-left,.hud-right{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.stat{
    background:#101827e8;
    border:2px solid #ffffff30;
    border-radius:10px;
    padding:8px 12px;
    font-weight:bold;
    box-shadow:0 5px 15px #0005;
}

#money{color:#6dff88}
#rep{color:#66d9ff}
#level{color:#ffd84d}

/* ---------- MENU ---------- */
#menu{
    position:absolute;
    left:12px;
    bottom:12px;
    z-index:100;
    display:flex;
    flex-direction:column;
    gap:7px;
}

button{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    font-weight:900;
    cursor:pointer;
    color:white;
    background:#1769aa;
    box-shadow:0 4px 0 #0b426b;
}

button:hover{filter:brightness(1.15)}
button:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #0b426b;
}

.green{background:#13a65b}
.orange{background:#d87920}
.red{background:#c63c43}
.purple{background:#7446bd}

/* ---------- PEOPLE ---------- */
.person{
    position:absolute;
    width:55px;
    height:110px;
    z-index:30;
    transition:transform .15s;
    user-select:none;
}

.person .head{
    position:absolute;
    left:12px;
    top:0;
    width:31px;
    height:31px;
    border-radius:50%;
    background:var(--skin);
    border:2px solid #442d28;
}

.person .hair{
    position:absolute;
    left:10px;
    top:-3px;
    width:35px;
    height:17px;
    border-radius:18px 18px 5px 5px;
    background:var(--hair);
    z-index:2;
}

.person .eye{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#222;
    top:13px;
    z-index:3;
}

.person .eye.one{left:19px}
.person .eye.two{left:30px}

.person .mouth{
    position:absolute;
    left:21px;
    top:21px;
    width:12px;
    height:5px;
    border-bottom:2px solid #632d2d;
    border-radius:0 0 10px 10px;
    z-index:3;
}

.person .body{
    position:absolute;
    left:13px;
    top:30px;
    width:30px;
    height:42px;
    background:var(--shirt);
    border:2px solid #333;
    border-radius:8px;
}

.person .arm{
    position:absolute;
    top:34px;
    width:9px;
    height:39px;
    background:var(--skin);
    border:2px solid #442d28;
    border-radius:8px;
    transform-origin:top;
}

.person .arm.left{left:6px;transform:rotate(10deg)}
.person .arm.right{right:5px;transform:rotate(-10deg)}

.person .leg{
    position:absolute;
    top:69px;
    width:11px;
    height:40px;
    background:var(--pants);
    border:2px solid #333;
    border-radius:6px;
}

.person .leg.left{left:14px}
.person .leg.right{left:30px}

.person.walk .leg.left{
    animation:walk1 .35s infinite alternate;
}
.person.walk .leg.right{
    animation:walk2 .35s infinite alternate;
}

@keyframes walk1{
    from{transform:rotate(14deg)}
    to{transform:rotate(-14deg)}
}
@keyframes walk2{
    from{transform:rotate(-14deg)}
    to{transform:rotate(14deg)}
}

/* ---------- SPEECH ---------- */
.speech{
    position:absolute;
    z-index:80;
    min-width:150px;
    max-width:240px;
    background:white;
    color:#222;
    border-radius:15px;
    padding:9px 12px;
    font-weight:bold;
    box-shadow:0 5px 18px #0006;
}

.speech:after{
    content:"";
    position:absolute;
    bottom:-10px;
    left:25px;
    border-width:10px 10px 0;
    border-style:solid;
    border-color:white transparent transparent;
}

/* ---------- CUSTOMER CARD ---------- */
#customerPanel{
    position:absolute;
    right:15px;
    bottom:15px;
    width:290px;
    max-width:calc(100vw - 30px);
    background:#f8fafc;
    color:#172033;
    border-radius:15px;
    padding:15px;
    z-index:150;
    box-shadow:0 12px 35px #0008;
    display:none;
}

#customerPanel h3{
    margin:0 0 7px;
}

#customerPanel p{
    margin:5px 0 10px;
}

#customerButtons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

/* ---------- PHONE ---------- */
#phone{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(500px,90vw);
    background:#101827;
    border:5px solid #39445a;
    border-radius:25px;
    padding:20px;
    z-index:300;
    display:none;
    box-shadow:0 30px 80px #000b;
}

#phone h2{
    margin-top:0;
}

.phone-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

/* ---------- UPGRADES ---------- */
#upgradePanel{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(650px,92vw);
    max-height:85vh;
    overflow:auto;
    background:#101827;
    border:4px solid #53627d;
    border-radius:20px;
    padding:20px;
    z-index:300;
    display:none;
}

.upgrade{
    background:#1c2739;
    padding:12px;
    border-radius:12px;
    margin-bottom:9px;
}

.upgrade h3{
    margin:0 0 5px;
}

/* ---------- NOTIFICATION ---------- */
#toast{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    z-index:500;
    background:#111827;
    border:2px solid #ffffff30;
    padding:12px 20px;
    border-radius:12px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

#toast.show{opacity:1}

/* ---------- MOBILE ---------- */
@media(max-width:700px){
    .stat{font-size:12px;padding:6px}
    #shop{width:85vw}
    .shop-window{left:20px;width:40%}
    .shop-door{right:20px}
    .shop-sign{font-size:17px}
}
</style>
</head>

<body>

<div id="game">

    <div id="sky">
        <div id="moon"></div>
    </div>

    <div id="city"></div>

    <div id="road">
        <div class="road-line"></div>
    </div>

    <div id="shop">
        <div class="shop-roof"></div>
        <div class="shop-sign">THE LAST SHOP</div>
        <div class="shop-window"></div>
        <div class="shop-door"></div>
        <div class="shop-counter"></div>
    </div>

    <div id="hud">
        <div class="hud-left">
            <div class="stat">💷 <span id="money">500</span></div>
            <div class="stat">⭐ <span id="rep">10</span></div>
            <div class="stat">🏆 Level <span id="level">1</span></div>
            <div class="stat">👥 <span id="customersServed">0</span></div>
        </div>

        <div class="hud-right">
            <div class="stat">📅 Day <span id="day">1</span></div>
            <div class="stat">🕐 <span id="clock">08:00</span></div>
            <div class="stat">🔥 Combo <span id="combo">0</span></div>
        </div>
    </div>

    <div id="menu">
        <button onclick="openPhone()">📱 PHONE</button>
        <button class="orange" onclick="openUpgrades()">⬆️ SHOP UPGRADES</button>
        <button class="green" onclick="saveGame()">💾 SAVE</button>
    </div>

    <div id="customerPanel">
        <h3 id="customerName">Customer</h3>
        <p id="customerRequest">I need something.</p>
        <div id="customerButtons"></div>
    </div>

    <div id="phone">
        <h2>📱 Your Phone</h2>

        <div class="phone-grid">
            <button onclick="showStats()">📊 Statistics</button>
            <button onclick="showInventory()">📦 Inventory</button>
            <button onclick="showMissions()">🎯 Missions</button>
            <button onclick="randomMessage()">💬 Messages</button>
        </div>

        <br>
        <button class="red" onclick="closePhone()">CLOSE</button>
    </div>

    <div id="upgradePanel">
        <h2>🏪 Shop Upgrades</h2>
        <div id="upgradeList"></div>
        <button class="red" onclick="closeUpgrades()">CLOSE</button>
    </div>

    <div id="toast"></div>

</div>

<script>

/* ============================================================
   THE LAST SHOP
   ENDLESS SHOP SIMULATION
   Everything is contained in this file.
   ============================================================ */

const SAVE_KEY = "the_last_shop_endless_v3";

/* ---------- GAME STATE ---------- */

let game = {
    money:500,
    reputation:10,
    level:1,
    day:1,
    hour:8,
    minute:0,

    customersServed:0,
    combo:0,
    bestCombo:0,

    inventory:{
        food:20,
        drink:20,
        bread:20,
        soap:20,
        tools:10,
        medicine:10,
        electronics:5,
        clothes:10
    },

    prices:{
        food:4,
        drink:3,
        bread:2,
        soap:5,
        tools:15,
        medicine:12,
        electronics:25,
        clothes:18
    },

    upgrades:{
        shelves:1,
        speed:1,
        reputation:1,
        staff:0,
        storage:1
    },

    totalEarned:0,
    totalSpent:0,
    missionsCompleted:0
};

let customers=[];
let selectedCustomer=null;
let nextCustomerId=1;

/* ---------- CUSTOMER DATA ---------- */

const names=[
    "Tom","Lucy","David","Sarah","Mike","Emma","John","Olivia",
    "Daniel","Sophie","Jack","Emily","James","Amelia","George",
    "Isla","Harry","Mia","Charlie","Grace","Noah","Ella",
    "Oscar","Lily","Leo","Chloe","Adam","Sofia","Ryan","Anna"
];

const requests=[
    {item:"food",text:"I need some food!",emoji:"🍎"},
    {item:"drink",text:"I'm really thirsty.",emoji:"🥤"},
    {item:"bread",text:"Do you have fresh bread?",emoji:"🍞"},
    {item:"soap",text:"I need soap.",emoji:"🧼"},
    {item:"tools",text:"I need some tools.",emoji:"🔨"},
    {item:"medicine",text:"Do you have medicine?",emoji:"💊"},
    {item:"electronics",text:"I need something electronic.",emoji:"📱"},
    {item:"clothes",text:"I need new clothes.",emoji:"👕"}
];

const personalities=[
    {
        name:"Friendly",
        phrases:["Thanks!","You're brilliant!","Lovely shop!","I'll come again!"]
    },
    {
        name:"In a hurry",
        phrases:["Quick please!","I'm late!","Come on!","I haven't got all day!"]
    },
    {
        name:"Talkative",
        phrases:["How are you?","Busy today, isn't it?","Nice shop!","I was just passing by."]
    },
    {
        name:"Grumpy",
        phrases:["Hmm...","This better be good.","I don't have much time.","It's expensive."]
    },
    {
        name:"Regular",
        phrases:["Good to see you again.","Same thing as usual.","I know this place well.","Back again!"]
    }
];

/* ---------- CHARACTER COLOURS ---------- */

const skinColours=[
    "#f1c27d","#e0ac69","#c68642","#8d5524","#ffdbac"
];

const hairColours=[
    "#20150f","#4a2918","#1b1b1b","#8b5a2b","#d7a22a","#5e3424"
];

const shirtColours=[
    "#ef4444","#3b82f6","#22c55e","#a855f7",
    "#f97316","#06b6d4","#eab308","#ec4899"
];

const pantsColours=[
    "#26364d","#172033","#39445c","#4b5563","#352b49"
];

/* ---------- CITY ---------- */

function createCity(){

    const city=document.getElementById("city");
    city.innerHTML="";

    for(let i=0;i<16;i++){

        const building=document.createElement("div");
        building.className="building";

        const height=80+Math.random()*180;

        building.style.height=height+"px";

        const windows=4+Math.floor(Math.random()*10);

        for(let w=0;w<windows;w++){

            const win=document.createElement("div");
            win.className="window";

            win.style.left=(10+Math.random()*75)+"%";
            win.style.top=(10+Math.random()*75)+"%";

            building.appendChild(win);
        }

        city.appendChild(building);
    }

    for(let i=0;i<35;i++){

        const star=document.createElement("div");
        star.className="star";

        star.style.left=Math.random()*100+"%";
        star.style.top=Math.random()*35+"%";

        document.getElementById("sky").appendChild(star);
    }
}

/* ---------- CHARACTER CREATION ---------- */

function createPerson(type="customer"){

    const p=document.createElement("div");

    p.className="person walk";

    const skin=skinColours[Math.floor(Math.random()*skinColours.length)];
    const hair=hairColours[Math.floor(Math.random()*hairColours.length)];
    const shirt=shirtColours[Math.floor(Math.random()*shirtColours.length)];
    const pants=pantsColours[Math.floor(Math.random()*pantsColours.length)];

    p.style.setProperty("--skin",skin);
    p.style.setProperty("--hair",hair);
    p.style.setProperty("--shirt",shirt);
    p.style.setProperty("--pants",pants);

    p.innerHTML=`
        <div class="head"></div>
        <div class="hair"></div>
        <div class="eye one"></div>
        <div class="eye two"></div>
        <div class="mouth"></div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>
    `;

    document.getElementById("game").appendChild(p);

    return p;
}

/* ---------- CUSTOMER ---------- */

function createCustomer(){

    const request=requests[
        Math.floor(Math.random()*requests.length)
    ];

    const personality=
        personalities[
            Math.floor(Math.random()*personalities.length)
        ];

    const customer={
        id:nextCustomerId++,
        name:names[Math.floor(Math.random()*names.length)],
        request:request,
        personality:personality,
        spent:0,
        element:createPerson()
    };

    customers.push(customer);

    const p=customer.element;

    p.style.left="-70px";
    p.style.top=(55+Math.random()*25)+"%";

    walkToShop(customer);

    return customer;
}

/* ---------- WALKING ---------- */

function walkToShop(customer){

    const p=customer.element;

    const target=40+Math.random()*20;

    let x=-70;

    function step(){

        if(!document.body.contains(p))return;

        x+=0.45;

        p.style.left=x+"%";

        if(x<target){
            requestAnimationFrame(step);
        }else{
            p.classList.remove("walk");
            customerArrived(customer);
        }
    }

    step();
}

function customerArrived(customer){

    if(!customers.includes(customer))return;

    const p=customer.element;

    p.style.zIndex=40;

    createSpeech(
        p,
        customer.personality.phrases[
            Math.floor(Math.random()*customer.personality.phrases.length)
        ],
        2000
    );

    setTimeout(()=>{

        if(customers.includes(customer)){
            openCustomer(customer);
        }

    },1000);
}

/* ---------- SPEECH ---------- */

function createSpeech(person,text,time=2500){

    const speech=document.createElement("div");

    speech.className="speech";

    speech.textContent=text;

    document.getElementById("game").appendChild(speech);

    const rect=person.getBoundingClientRect();
    const gameRect=document
        .getElementById("game")
        .getBoundingClientRect();

    speech.style.left=(rect.left-gameRect.left-50)+"px";
    speech.style.top=(rect.top-gameRect.top-65)+"px";

    setTimeout(()=>{
        speech.remove();
    },time);
}

/* ---------- CUSTOMER PANEL ---------- */

function openCustomer(customer){

    selectedCustomer=customer;

    document.getElementById("customerPanel").style.display="block";

    document.getElementById("customerName").textContent=
        customer.name+" 👤";

    document.getElementById("customerRequest").innerHTML=
        customer.request.emoji+" "+customer.request.text;

    const buttons=document.getElementById("customerButtons");

    buttons.innerHTML="";

    const serve=document.createElement("button");

    serve.className="green";

    serve.textContent=
        "SERVE "+customer.request.emoji;

    serve.onclick=()=>serveCustomer(customer);

    buttons.appendChild(serve);

    const talk=document.createElement("button");

    talk.className="purple";

    talk.textContent="💬 TALK";

    talk.onclick=()=>talkCustomer(customer);

    buttons.appendChild(talk);

    const ignore=document.createElement("button");

    ignore.className="red";

    ignore.textContent="❌ IGNORE";

    ignore.onclick=()=>ignoreCustomer(customer);

    buttons.appendChild(ignore);
}

/* ---------- SERVE ---------- */

function serveCustomer(customer){

    if(!customers.includes(customer))return;

    const item=customer.request.item;

    if(game.inventory[item]<=0){

        toast("❌ You are out of "+item+"!");

        game.combo=0;

        updateHUD();

        return;
    }

    game.inventory[item]--;

    let price=game.prices[item];

    const bonus=
        1+
        game.upgrades.reputation*0.05+
        game.combo*0.02;

    price=Math.round(price*bonus);

    game.money+=price;

    game.totalEarned+=price;

    game.customersServed++;

    game.combo++;

    if(game.combo>game.bestCombo)
        game.bestCombo=game.combo;

    game.reputation+=0.15*game.upgrades.reputation;

    customer.spent=price;

    createSpeech(
        customer.element,
        customer.personality.phrases[
            Math.floor(
                Math.random()*
                customer.personality.phrases.length
            )
        ],
        1800
    );

    toast(
        "💷 +£"+price+
        "   🔥 Combo x"+game.combo
    );

    closeCustomerPanel();

    animateCustomerLeaving(customer);

    checkLevel();

    updateHUD();

    checkMissions();
}

/* ---------- TALK ---------- */

function talkCustomer(customer){

    const lines=[
        "Nice weather today!",
        "Have you been busy?",
        "I really like this shop.",
        "I heard there are new products.",
        "I'll tell my friends about this place.",
        "I come here all the time.",
        "You should expand the shop!",
        "Do you have any special offers?"
    ];

    const line=
        lines[Math.floor(Math.random()*lines.length)];

    createSpeech(customer.element,line,3000);

    game.reputation+=0.1;

    updateHUD();
}

/* ---------- IGNORE ---------- */

function ignoreCustomer(customer){

    game.reputation=Math.max(0,game.reputation-0.5);
    game.combo=0;

    toast("😕 Customer left unhappy.");

    closeCustomerPanel();

    animateCustomerLeaving(customer);

    updateHUD();
}

/* ---------- CUSTOMER LEAVING ---------- */

function animateCustomerLeaving(customer){

    if(!customers.includes(customer))return;

    const p=customer.element;

    p.classList.add("walk");

    let x=parseFloat(p.style.left)||50;

    function move(){

        x+=0.7;

        p.style.left=x+"%";

        if(x<110){

            requestAnimationFrame(move);

        }else{

            p.remove();

            customers=
                customers.filter(c=>c!==customer);
        }
    }

    move();
}

function closeCustomerPanel(){

    document.getElementById("customerPanel").style.display="none";

    selectedCustomer=null;
}

/* ---------- ENDLESS CUSTOMER SPAWNER ---------- */

function spawnCustomers(){

    const max=
        2+
        game.upgrades.shelves+
        game.upgrades.staff;

    if(customers.length<max){

        const amount=
            Math.random()<0.2 ? 2 : 1;

        for(let i=0;i<amount;i++){

            setTimeout(
                createCustomer,
                i*700
            );
        }
    }
}

/* ---------- GAME CLOCK ---------- */

function gameClock(){

    game.minute+=5;

    if(game.minute>=60){

        game.minute=0;
        game.hour++;
    }

    if(game.hour>=24){

        game.hour=0;
        game.day++;

        dailyEvent();
    }

    updateDayNight();
    updateHUD();
}

/* ---------- DAY/NIGHT ---------- */

function updateDayNight(){

    const sky=document.getElementById("sky");

    const hour=game.hour;

    if(hour>=6 && hour<18){

        sky.style.background=
            "linear-gradient(#1672bd,#58b8ef)";

        document.getElementById("moon")
            .style.display="none";

    }else{

        sky.style.background=
            "linear-gradient(#07152d,#152e52)";

        document.getElementById("moon")
            .style.display="block";
    }
}

/* ---------- DAILY EVENTS ---------- */

function dailyEvent(){

    const events=[
        "🌧️ Rainy day! Customers are staying indoors.",
        "☀️ Sunny day! Lots of people are outside.",
        "🎉 Local festival! More customers are coming.",
        "🚧 Roadworks nearby! Customer traffic is slower.",
        "📣 Your shop was mentioned locally!",
        "🛍️ Shopping weekend! Sales are increased.",
        "💡 A new competitor opened nearby.",
        "⭐ Your reputation is growing!"
    ];

    const event=
        events[Math.floor(Math.random()*events.length)];

    toast(event);

    if(event.includes("festival")){
        game.reputation+=1;
    }

    if(event.includes("mentioned")){
        game.reputation+=2;
    }

    updateHUD();
}

/* ---------- LEVEL ---------- */

function checkLevel(){

    const newLevel=
        Math.floor(game.customersServed/10)+1;

    if(newLevel>game.level){

        game.level=newLevel;

        game.money+=game.level*20;

        toast(
            "🎉 LEVEL "+game.level+
            "! Bonus £"+(game.level*20)
        );
    }
}

/* ---------- UPGRADES ---------- */

const upgrades=[
    {
        id:"shelves",
        name:"🗄️ More Shelves",
        description:"Allows more customers to visit.",
        base:100
    },
    {
        id:"speed",
        name:"⚡ Faster Service",
        description:"Customers wait longer and service improves.",
        base:150
    },
    {
        id:"reputation",
        name:"⭐ Better Reputation",
        description:"Increase money earned and reputation.",
        base:200
    },
    {
        id:"staff",
        name:"👨‍💼 Hire Staff",
        description:"Staff help keep customers moving.",
        base:300
    },
    {
        id:"storage",
        name:"📦 Bigger Storage",
        description:"Automatically increases stock capacity.",
        base:120
    }
];

function openUpgrades(){

    document.getElementById("upgradePanel")
        .style.display="block";

    renderUpgrades();
}

function closeUpgrades(){

    document.getElementById("upgradePanel")
        .style.display="none";
}

function renderUpgrades(){

    const list=document.getElementById("upgradeList");

    list.innerHTML="";

    upgrades.forEach(u=>{

        const current=game.upgrades[u.id];

        const cost=
            Math.floor(
                u.base*
                Math.pow(1.65,current-1)
            );

        const div=document.createElement("div");

        div.className="upgrade";

        div.innerHTML=`
            <h3>${u.name} — Level ${current}</h3>
            <p>${u.description}</p>
            <button
                class="green"
                onclick="buyUpgrade('${u.id}')">
                BUY £${cost}
            </button>
        `;

        list.appendChild(div);
    });
}

function buyUpgrade(id){

    const u=upgrades.find(x=>x.id===id);

    const level=game.upgrades[id];

    const cost=
        Math.floor(
            u.base*
            Math.pow(1.65,level-1)
        );

    if(game.money<cost){

        toast("❌ Not enough money.");

        return;
    }

    game.money-=cost;

    game.upgrades[id]++;

    if(id==="storage"){

        const amount=
            10*
            game.upgrades.storage;

        Object.keys(game.inventory).forEach(item=>{

            game.inventory[item]+=amount;
        });
    }

    toast(
        "⬆️ "+u.name+
        " upgraded to level "+
        game.upgrades[id]
    );

    renderUpgrades();
    updateHUD();
}

/* ---------- PHONE ---------- */

function openPhone(){

    document.getElementById("phone")
        .style.display="block";
}

function closePhone(){

    document.getElementById("phone")
        .style.display="none";
}

function showStats(){

    alert(
`📊 SHOP STATISTICS

Money: £${game.money}

Total earned: £${game.totalEarned}

Total spent: £${game.totalSpent}

Customers served: ${game.customersServed}

Best combo: x${game.bestCombo}

Reputation: ${game.reputation.toFixed(1)}

Level: ${game.level}

Day: ${game.day}`
    );
}

function showInventory(){

    alert(
`📦 INVENTORY

🍎 Food: ${game.inventory.food}
🥤 Drinks: ${game.inventory.drink}
🍞 Bread: ${game.inventory.bread}
🧼 Soap: ${game.inventory.soap}
🔨 Tools: ${game.inventory.tools}
💊 Medicine: ${game.inventory.medicine}
📱 Electronics: ${game.inventory.electronics}
👕 Clothes: ${game.inventory.clothes}`
    );
}

function showMissions(){

    const target=
        Math.max(
            10,
            game.level*10
        );

    alert(
`🎯 CURRENT MISSIONS

Serve ${target} customers
Current: ${game.customersServed}

Reach reputation ${game.level*10}
Current: ${game.reputation.toFixed(1)}

Earn £${game.level*500}
Current: £${game.totalEarned}

There is NO final mission.
New missions continue forever.`
    );
}

function randomMessage(){

    const messages=[
        "📱 Lucy: See you tomorrow!",
        "📱 David: Great shop!",
        "📱 Sarah: Do you have new products?",
        "📱 Tom: I'll bring my friends.",
        "📱 Mike: The shop is getting busy!",
        "📱 Emma: Congratulations on the new level!"
    ];

    toast(
        messages[
            Math.floor(Math.random()*messages.length)
        ]
    );
}

/* ---------- MISSIONS ---------- */

function checkMissions(){

    if(
        game.customersServed>0 &&
        game.customersServed%10===0
    ){

        const reward=
            50+
            game.level*20;

        game.money+=reward;

        game.missionsCompleted++;

        toast(
            "🎯 MISSION COMPLETE! +£"+
            reward
        );
    }
}

/* ---------- HUD ---------- */

function updateHUD(){

    document.getElementById("money")
        .textContent=Math.floor(game.money);

    document.getElementById("rep")
        .textContent=game.reputation.toFixed(1);

    document.getElementById("level")
        .textContent=game.level;

    document.getElementById("customersServed")
        .textContent=game.customersServed;

    document.getElementById("day")
        .textContent=game.day;

    const h=
        String(game.hour).padStart(2,"0");

    const m=
        String(game.minute).padStart(2,"0");

    document.getElementById("clock")
        .textContent=h+":"+m;

    document.getElementById("combo")
        .textContent=game.combo;
}

/* ---------- SAVE ---------- */

function saveGame(){

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(game)
    );

    toast("💾 Game saved!");
}

function loadGame(){

    const saved=
        localStorage.getItem(SAVE_KEY);

    if(!saved)return;

    try{

        const data=JSON.parse(saved);

        game={
            ...game,
            ...data,
            inventory:{
                ...game.inventory,
                ...(data.inventory||{})
            },
            upgrades:{
                ...game.upgrades,
                ...(data.upgrades||{})
            }
        };

    }catch(e){

        console.log("Save could not be loaded.");
    }
}

/* ---------- TOAST ---------- */

let toastTimer;

function toast(text){

    const t=document.getElementById("toast");

    t.textContent=text;

    t.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{

        t.classList.remove("show");

    },2500);
}

/* ---------- AUTO SAVE ---------- */

setInterval(()=>{

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(game)
    );

},10000);

/* ---------- RANDOM SHOP TALK ---------- */

function shopTalk(){

    if(customers.length<2)return;

    const a=
        customers[
            Math.floor(Math.random()*customers.length)
        ];

    const b=
        customers[
            Math.floor(Math.random()*customers.length)
        ];

    if(a===b)return;

    createSpeech(
        a.element,
        "Have you been here before?",
        1800
    );

    setTimeout(()=>{

        createSpeech(
            b.element,
            "Yes! I love this shop.",
            1800
        );

    },1000);
}

/* ---------- RANDOM EVENTS ---------- */

function randomEvent(){

    const roll=Math.random();

    if(roll<0.08){

        const bonus=
            20+
            Math.floor(Math.random()*80);

        game.money+=bonus;

        toast(
            "🎁 A customer left a £"+
            bonus+
            " tip!"
        );

    }else if(roll<0.12){

        game.reputation+=1;

        toast(
            "⭐ Someone recommended your shop!"
        );

    }else if(roll<0.15){

        const item=
            Object.keys(game.inventory)
            [Math.floor(
                Math.random()*
                Object.keys(game.inventory).length
            )];

        game.inventory[item]+=5;

        toast(
            "📦 Supplier delivered extra "+
            item+"!"
        );
    }

    updateHUD();
}

/* ---------- START ---------- */

function startGame(){

    loadGame();

    createCity();

    updateDayNight();

    updateHUD();

    /* initial customers */

    setTimeout(createCustomer,1000);
    setTimeout(createCustomer,2500);
    setTimeout(createCustomer,4500);

    /* customer generator */

    setInterval(
        spawnCustomers,
        2500
    );

    /* game clock */

    setInterval(
        gameClock,
        1000
    );

    /* random events */

    setInterval(
        randomEvent,
        12000
    );

    /* customers talking */

    setInterval(
        shopTalk,
        7000
    );

    /* combo slowly decreases */

    setInterval(()=>{

        if(game.combo>0){

            game.combo--;

            updateHUD();
        }

    },8000);

    toast(
        "🏪 Welcome to THE LAST SHOP!"
    );
}

startGame();

</script>
