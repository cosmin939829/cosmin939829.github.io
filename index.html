<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Last Shop</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111827;
    font-family: Arial, sans-serif;
    overflow: hidden;
    user-select: none;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
        #6b4f3a;
    background-size: 40px 40px;
}

/* TOP BAR */

#topBar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(17,24,39,.95);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 20;
    border-bottom: 2px solid #374151;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #fbbf24;
}

.stats {
    display: flex;
    gap: 25px;
    font-size: 17px;
}

.stat {
    display: flex;
    gap: 7px;
    align-items: center;
}

/* SHOP */

#shop {
    position: absolute;
    left: 7%;
    right: 7%;
    top: 100px;
    bottom: 50px;
    background: #d6b98c;
    border: 12px solid #3f2d20;
    box-shadow: inset 0 0 0 5px #8b6a47,
                0 20px 50px rgba(0,0,0,.45);
}

/* FLOOR */

#floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 68%;
    background:
        linear-gradient(90deg, rgba(80,50,30,.25) 2px, transparent 2px),
        linear-gradient(rgba(80,50,30,.25) 2px, transparent 2px),
        #b8895d;
    background-size: 70px 70px;
}

/* WALL */

#wall {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 32%;
    background: #cdb184;
}

/* WINDOWS */

.window {
    position: absolute;
    top: 35px;
    width: 150px;
    height: 100px;
    background: linear-gradient(#79b8e8,#d5efff);
    border: 10px solid #553b27;
}

.window:before,
.window:after {
    content: "";
    position: absolute;
    background: #553b27;
}

.window:before {
    width: 8px;
    top: 0;
    bottom: 0;
    left: 50%;
}

.window:after {
    height: 8px;
    left: 0;
    right: 0;
    top: 50%;
}

.window.left {
    left: 8%;
}

.window.right {
    right: 8%;
}

/* SIGN */

#sign {
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    background: #2b2119;
    color: #fbbf24;
    padding: 15px 35px;
    border: 5px solid #705234;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* COUNTER */

#counter {
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: 18%;
    height: 90px;
    background: #67452c;
    border: 8px solid #3e281a;
    box-shadow: 0 10px 20px rgba(0,0,0,.3);
}

/* SHELVES */

.shelf {
    position: absolute;
    width: 170px;
    height: 100px;
    background: #704a2d;
    border: 8px solid #412818;
}

.shelf.left {
    left: 5%;
    top: 25%;
}

.shelf.right {
    right: 5%;
    top: 25%;
}

/* ITEMS */

.item {
    position: absolute;
    font-size: 42px;
    cursor: pointer;
    transition: transform .15s;
    z-index: 5;
}

.item:hover {
    transform: scale(1.15);
}

#chair {
    left: 25%;
    bottom: 25%;
}

#lamp {
    right: 25%;
    bottom: 26%;
}

#box {
    left: 45%;
    bottom: 30%;
    font-size: 55px;
}

/* PLAYER */

#player {
    position: absolute;
    width: 45px;
    height: 55px;
    left: 50%;
    bottom: 25%;
    transform: translateX(-50%);
    z-index: 10;
}

.player-head {
    width: 34px;
    height: 34px;
    background: #f2b880;
    border-radius: 50%;
    margin: auto;
    border: 3px solid #39261b;
}

.player-body {
    width: 40px;
    height: 30px;
    background: #2563eb;
    border-radius: 10px 10px 5px 5px;
    margin: -2px auto 0;
    border: 3px solid #172554;
}

/* INTERACTION */

#interaction {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: rgba(17,24,39,.95);
    color: white;
    padding: 12px 25px;
    border-radius: 12px;
    font-size: 16px;
    display: none;
    z-index: 30;
}

/* MESSAGE */

#message {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(17,24,39,.95);
    color: white;
    padding: 15px 25px;
    border-radius: 12px;
    z-index: 40;
    display: none;
    max-width: 500px;
    text-align: center;
}

#message button {
    margin-top: 12px;
    background: #fbbf24;
    color: #111827;
    border: 0;
    padding: 9px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

/* MOBILE CONTROLS */

#controls {
    position: absolute;
    bottom: 20px;
    right: 25px;
    display: grid;
    grid-template-columns: 55px 55px 55px;
    grid-template-rows: 55px 55px;
    gap: 5px;
    z-index: 25;
}

.control {
    background: rgba(17,24,39,.75);
    color: white;
    border: 2px solid #6b7280;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
}

.down {
    grid-column: 2;
}

.right {
    grid-column: 3;
}

@media(max-width:700px) {

    #topBar {
        height: 58px;
        padding: 0 10px;
    }

    .logo {
        font-size: 17px;
    }

    .stats {
        gap: 8px;
        font-size: 12px;
    }

    #shop {
        left: 2%;
        right: 2%;
        top: 75px;
        bottom: 15px;
    }

    #sign {
        font-size: 17px;
        padding: 9px 15px;
    }

    .window {
        width: 90px;
        height: 65px;
    }

    .shelf {
        width: 100px;
        height: 70px;
    }

    #controls {
        right: 10px;
        bottom: 10px;
        transform: scale(.8);
        transform-origin: bottom right;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="topBar">
        <div class="logo">🏚️ THE <span>LAST SHOP</span></div>

        <div class="stats">
            <div class="stat">💷 <span id="money">2</span></div>
            <div class="stat">⭐ <span id="reputation">0</span></div>
            <div class="stat">📅 Day <span id="day">1</span></div>
        </div>
    </div>

    <div id="shop">

        <div id="wall"></div>

        <div id="floor"></div>

        <div id="sign">
            THE LAST SHOP
        </div>

        <div class="window left"></div>
        <div class="window right"></div>

        <div class="shelf left"></div>
        <div class="shelf right"></div>

        <div id="counter"></div>

        <div id="chair" class="item" data-name="Broken Chair">🪑</div>

        <div id="lamp" class="item" data-name="Old Lamp">💡</div>

        <div id="box" class="item" data-name="Old Box">📦</div>

        <div id="player">
            <div class="player-head"></div>
            <div class="player-body"></div>
        </div>

    </div>

    <div id="interaction">
        Press <b>SPACE</b> to interact
    </div>

    <div id="message"></div>

    <div id="controls">
        <div class="control up" data-key="ArrowUp">▲</div>
        <div class="control left" data-key="ArrowLeft">◀</div>
        <div class="control down" data-key="ArrowDown">▼</div>
        <div class="control right" data-key="ArrowRight">▶</div>
    </div>

</div>

<script>

let playerX = 50;
let playerY = 65;

let money = 2;
let reputation = 0;
let day = 1;

let nearbyItem = null;

const player = document.getElementById("player");
const interaction = document.getElementById("interaction");
const message = document.getElementById("message");

function updatePlayer() {

    player.style.left = playerX + "%";
    player.style.bottom = playerY + "%";

    checkNearby();
}

function move(direction) {

    const speed = 2;

    if(direction === "up") {
        playerY = Math.min(playerY + speed, 75);
    }

    if(direction === "down") {
        playerY = Math.max(playerY - speed, 8);
    }

    if(direction === "left") {
        playerX = Math.max(playerX - speed, 7);
    }

    if(direction === "right") {
        playerX = Math.min(playerX + speed, 93);
    }

    updatePlayer();
}

document.addEventListener("keydown", function(e) {

    if(e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
        move("up");
    }

    if(e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
        move("down");
    }

    if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        move("left");
    }

    if(e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        move("right");
    }

    if(e.code === "Space") {
        interact();
    }

});

document.querySelectorAll(".control").forEach(button => {

    button.addEventListener("click", function() {

        const key = this.dataset.key;

        if(key === "ArrowUp") move("up");
        if(key === "ArrowDown") move("down");
        if(key === "ArrowLeft") move("left");
        if(key === "ArrowRight") move("right");

    });

});

function checkNearby() {

    const items = document.querySelectorAll(".item");

    nearbyItem = null;

    items.forEach(item => {

        const rect = item.getBoundingClientRect();
        const playerRect = player.getBoundingClientRect();

        const distanceX =
            Math.abs(rect.left - playerRect.left);

        const distanceY =
            Math.abs(rect.top - playerRect.top);

        if(distanceX < 80 && distanceY < 80) {
            nearbyItem = item;
        }

    });

    if(nearbyItem) {
        interaction.style.display = "block";
        interaction.innerHTML =
            "Press <b>SPACE</b> to interact with " +
            nearbyItem.dataset.name;
    } else {
        interaction.style.display = "none";
    }
}

function interact() {

    if(!nearbyItem) return;

    const name = nearbyItem.dataset.name;

    if(name === "Old Box") {

        showMessage(
            "📦 You found an old box!<br><br>" +
            "There might be something useful inside..."
        );

        nearbyItem.innerHTML = "🧰";
        nearbyItem.dataset.name = "Tool Box";

        reputation += 1;

    }

    else if(name === "Broken Chair") {

        if(money >= 1) {

            money -= 1;
            reputation += 5;

            nearbyItem.innerHTML = "🪑✨";
            nearbyItem.dataset.name = "Repaired Chair";

            showMessage(
                "🔨 You repaired the chair!<br><br>" +
                "It looks good enough to sell."
            );

        } else {

            showMessage(
                "💷 You need £1 to repair this chair."
            );

        }

    }

    else if(name === "Old Lamp") {

        showMessage(
            "💡 The lamp is broken.<br><br>" +
            "You need to find some parts before you can repair it."
        );

    }

    updateStats();

}

function showMessage(text) {

    message.innerHTML =
        text +
        '<br><button onclick="closeMessage()">OK</button>';

    message.style.display = "block";
}

function closeMessage() {
    message.style.display = "none";
}

function updateStats() {

    document.getElementById("money").textContent = money;
    document.getElementById("reputation").textContent = reputation;
    document.getElementById("day").textContent = day;

}

updatePlayer();

</script>

</body>
</html>
