<!-- =========================
     60 SECOND AD SYSTEM
========================= -->

<style>

#adOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:99999;
}

#adOverlay.show{
    display:flex;
}

#adBox{
    width:min(500px,95%);
    min-height:300px;
    background:#fff;
    border-radius:20px;
    padding:25px;
    text-align:center;
    position:relative;
    box-shadow:0 20px 60px #0008;
}

#adBox h2{
    margin-top:10px;
    color:#172033;
}

#adLabel{
    font-size:12px;
    color:#777;
    margin-bottom:15px;
}

#adContent{
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f3f5fa;
    border-radius:14px;
    margin:10px 0 18px;
}

#adClose{
    border:0;
    border-radius:10px;
    padding:11px 22px;
    background:#1467dc;
    color:#fff;
    font-weight:900;
    cursor:pointer;
    font-size:16px;
}

#adCountdown{
    font-weight:900;
    color:#555;
    margin-bottom:10px;
}

</style>


<!-- AD POPUP -->

<div id="adOverlay">

    <div id="adBox">

        <div id="adLabel">
            Advertisement
        </div>

        <h2>
            🎮 Thanks for playing!
        </h2>

        <div id="adContent">

            <!--
            YOUR AD WILL GO HERE.

            If you use Google AdSense,
            put your AdSense ad code here.
            -->

            <div>
                <div style="font-size:45px;">
                    📢
                </div>

                <b>
                    Advertisement
                </b>

                <p style="color:#777;">
                    Your advertisement will appear here.
                </p>
            </div>

        </div>

        <div id="adCountdown">
            Advertisement
        </div>

        <button
            id="adClose"
            onclick="closeAd()">

            Continue Playing ▶

        </button>

    </div>

</div>


<script>

/* ==========================================
   60 SECOND AD TIMER
========================================== */

let adSeconds = 60;
let adTimer = null;


/* START TIMER */

function startAdTimer(){

    /* Stop any old timer */

    if(adTimer){

        clearInterval(adTimer);

    }


    /* Start again at 60 seconds */

    adSeconds = 60;


    adTimer = setInterval(function(){

        adSeconds--;


        if(adSeconds <= 0){

            clearInterval(adTimer);

            adTimer = null;

            showAd();

        }

    },1000);

}


/* SHOW AD */

function showAd(){

    const ad =
        document.getElementById('adOverlay');

    if(ad){

        ad.classList.add('show');

    }

}


/* CLOSE AD */

function closeAd(){

    const ad =
        document.getElementById('adOverlay');

    if(ad){

        ad.classList.remove('show');

    }


    /* Start another 60 second countdown */

    startAdTimer();

}


/* START FIRST 60 SECOND COUNTDOWN */

startAdTimer();


/* ==========================================
   IF USER CLOSES THE GAME,
   RESTART THE AD TIMER
========================================== */

const originalCloseGame =
    window.closeGame;

window.closeGame = function(){

    if(typeof originalCloseGame === 'function'){

        originalCloseGame();

    }

    startAdTimer();

};

</script>
