<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Last Shop</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#111827;
}

button{
    border:0;
    cursor:pointer;
    font-weight:700;
}

.hidden{display:none!important}

/* =========================
   LOGIN
========================= */

#loginScreen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,#334155,transparent 35%),
        radial-gradient(circle at 80% 80%,#1e3a8a,transparent 35%),
        #020617;
    z-index:9999;
}

.loginBox{
    width:min(430px,92vw);
    padding:32px;
    border-radius:22px;
    background:#f8fafc;
    color:#111827;
    box-shadow:0 30px 100px #0009;
}

.loginTitle{
    text-align:center;
    font-size:34px;
    font-weight:900;
    color:#f59e0b;
}

.loginSub{
    text-align:center;
    color:#64748b;
    margin:8px 0 24px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:2px solid #cbd5e1;
    border-radius:10px;
    font-size:16px;
}

.greenBtn{
    width:100%;
    padding:14px;
    border-radius:10px;
    background:#16a34a;
    color:#fff;
    font-size:16px;
}

.blueBtn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
}

.loginMessage{
    margin-top:12px;
    text-align:center;
    color:#dc2626;
}

/* =========================
   GAME UI
========================= */

#game{
    width:100vw;
    height:100vh;
    background:#111827;
}

.topbar{
    height:68px;
    background:#0f172a;
    color:#fff;
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 14px;
    position:relative;
    z-index:1000;
}

.logo{
    color:#fbbf24;
    font-size:21px;
    font-weight:900;
    margin-right:auto;
}

.stat{
    padding:9px 11px;
    border-radius:9px;
    background:#1e293b;
    font-size:13px;
}

.stat span{
    color:#facc15;
    font-weight:900;
}

.uiBtn{
    padding:9px 12px;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
}

.redBtn{background:#dc2626}

/* =========================
   WORLD
========================= */

#world{
    position:relative;
    width:100%;
    height:calc(100vh - 68px);
    min-height:560px;
    overflow:hidden;
    background:#93c5fd;
}

.sky{
    position:absolute;
    inset:0 0 53% 0;
    background:
        radial-gradient(circle at 18% 24%,#fff 0 16px,transparent 17px),
        radial-gradient(circle at 22% 24%,#fff 0 12px,transparent 13px),
        radial-gradient(circle at 73% 16%,#fff 0 14px,transparent 15px),
        linear-gradient(#60a5fa,#bfdbfe);
}

.cloud{
    position:absolute;
    width:130px;
    height:35px;
    background:#fff;
    border-radius:40px;
    opacity:.8;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
}

.cloud:before{
    width:55px;
    height:55px;
    left:20px;
    top:-25px;
}

.cloud:after{
    width:45px;
    height:45px;
    right:18px;
    top:-17px;
}

.cloud1{left:12%;top:15%}
.cloud2{right:13%;top:28%}

/* city */

.cityBuilding{
    position:absolute;
    bottom:47%;
    width:120px;
    background:#475569;
    border:4px solid #334155;
}

.cityBuilding:after{
    content:"";
    position:absolute;
    inset:14px;
    background:
        repeating-linear-gradient(
            90deg,
            #fef08a 0 14px,
            transparent 14px 29px
        ),
        repeating-linear-gradient(
            0deg,
            #fef08a 0 14px,
            transparent 14px 30px
        );
    opacity:.55;
}

.cb1{left:3%;height:190px}
.cb2{left:17%;height:260px}
.cb3{right:17%;height:220px}
.cb4{right:3%;height:170px}

/* road */

.road{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:48%;
    background:#374151;
}

.roadMark{
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:7px;
    background:repeating-linear-gradient(
        90deg,
        #facc15 0 70px,
        transparent 70px 135px
    );
}

/* =========================
   SHOP BUILDING
========================= */

.shop{
    position:absolute;
    width:min(720px,72vw);
    height:470px;
    left:50%;
    top:7%;
    transform:translateX(-50%);
    background:#b45309;
    border:9px solid #78350f;
    border-radius:9px;
    box-shadow:0 22px 50px #0006;
}

.shopRoof{
    position:absolute;
    left:-9px;
    right:-9px;
    top:-50px;
    height:50px;
    border:9px solid #78350f;
    border-bottom:0;
    background:
        repeating-linear-gradient(
            135deg,
            #dc2626 0 25px,
            #f97316 25px 50px
        );
}

.shopName{
    position:absolute;
    left:50%;
    top:-39px;
    transform:translateX(-50%);
    padding:10px 25px;
    background:#facc15;
    border:4px solid #78350f;
    color:#713f12;
    border-radius:8px;
    font-size:22px;
    font-weight:900;
    white-space:nowrap;
    z-index:20;
}

.shopInterior{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#fde68a;
}

.wall{
    position:absolute;
    inset:0 0 64% 0;
    background:
        linear-gradient(#fef3c7,#fde68a);
}

.window{
    position:absolute;
    top:20px;
    width:145px;
    height:78px;
    background:linear-gradient(#7dd3fc,#dbeafe);
    border:7px solid #78350f;
}

.window.left{left:18px}
.window.right{right:18px}

.floor{
    position:absolute;
    inset:35% 0 0;
    background:
        repeating-linear-gradient(
            0deg,
            #d6d3d1 0 34px,
            #bcb7b3 35px 37px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0 47px,
            #0000000c 48px 49px
        );
}

/* =========================
   SHELVES
========================= */

.shelf{
    position:absolute;
    width:145px;
    height:175px;
    background:#8b5e3c;
    border:5px solid #4b2e1b;
    border-radius:4px;
    z-index:10;
}

.shelf1{left:25px;top:145px}
.shelf2{left:calc(50% - 72px);top:145px}
.shelf3{right:25px;top:145px}

.shelfRow{
    position:absolute;
    left:8px;
    right:8px;
    height:5px;
    background:#4b2e1b;
}

.row1{top:48px}
.row2{top:93px}
.row3{top:138px}

.items{
    position:absolute;
    inset:7px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:4px;
}

.item{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    filter:drop-shadow(0 2px 1px #0005);
}

/* checkout */

.checkout{
    position:absolute;
    width:340px;
    height:82px;
    bottom:17px;
    left:50%;
    transform:translateX(-50%);
    background:#92400e;
    border:7px solid #5b371f;
    border-radius:8px;
    z-index:20;
}

.register{
    position:absolute;
    right:25px;
    top:-48px;
    width:75px;
    height:43px;
    border:5px solid #475569;
    background:#111827;
    border-radius:6px;
    color:#22c55e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
}

.cashierLabel{
    position:absolute;
    left:20px;
    top:25px;
    color:#fef3c7;
    font-weight:900;
}

/* =========================
   PLAYER
========================= */

.actor{
    position:absolute;
    width:64px;
    height:105px;
    z-index:100;
    transition:
        left .8s ease,
        top .8s ease;
}

.actorHead{
    position:absolute;
    left:18px;
    top:0;
    width:30px;
    height:30px;
    background:#eab895;
    border:2px solid #78350f;
    border-radius:50%;
}

.actorHair{
    position:absolute;
    left:17px;
    top:-3px;
    width:32px;
    height:15px;
    border-radius:18px 18px 4px 4px;
    background:#382516;
    z-index:3;
}

.eye{
    position:absolute;
    width:4px;
    height:4px;
    background:#111827;
    border-radius:50%;
    top:13px;
    z-index:4;
}

.eyeA{left:24px}
.eyeB{left:36px}

.smile{
    position:absolute;
    width:11px;
    height:5px;
    left:27px;
    top:20px;
    border-bottom:2px solid #7f1d1d;
    z-index:4;
}

.actorBody{
    position:absolute;
    left:16px;
    top:29px;
    width:34px;
    height:46px;
    background:#2563eb;
    border-radius:9px 9px 4px 4px;
}

.actorArm{
    position:absolute;
    top:34px;
    width:10px;
    height:42px;
    background:#eab895;
    border-radius:8px;
}

.actorArmA{
    left:7px;
    transform:rotate(12deg);
}

.actorArmB{
    right:7px;
    transform:rotate(-12deg);
}

.actorLeg{
    position:absolute;
    top:71px;
    width:11px;
    height:35px;
    background:#1e293b;
    border-radius:6px;
}

.actorLegA{left:20px}
.actorLegB{left:36px}

.actorName{
    position:absolute;
    top:107px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    color:#111827;
    padding:3px 7px;
    border-radius:7px;
    font-size:10px;
    white-space:nowrap;
}

/* =========================
   CUSTOMERS
========================= */

.customer{
    position:absolute;
    width:64px;
    height:105px;
    z-index:90;
    transition:
        left 1.4s ease,
        top 1.4s ease;
}

.customerHead{
    position:absolute;
    left:18px;
    top:0;
    width:30px;
    height:30px;
    background:#f1c4a5;
    border:2px solid #78350f;
    border-radius:50%;
}

.customerHair{
    position:absolute;
    left:17px;
    top:-3px;
    width:32px;
    height:14px;
    border-radius:18px 18px 4px 4px;
    background:#3f2818;
    z-index:3;
}

.customerBody{
    position:absolute;
    left:16px;
    top:29px;
    width:34px;
    height:46px;
    border-radius:9px 9px 4px 4px;
}

.customerArm{
    position:absolute;
    top:34px;
    width:10px;
    height:42px;
    background:#f1c4a5;
    border-radius:8px;
}

.ca1{left:7px;transform:rotate(12deg)}
.ca2{right:7px;transform:rotate(-12deg)}

.customerLeg{
    position:absolute;
    top:71px;
    width:11px;
    height:35px;
    background:#1e293b;
    border-radius:6px;
}

.cl1{left:20px}
.cl2{left:36px}

.customerName{
    position:absolute;
    top:107px;
    left:50%;
    transform:translateX(-50%);
    padding:3px 7px;
    border-radius:7px;
    background:#fff;
    color:#111827;
    font-size:10px;
    white-space:nowrap;
}

/* =========================
   LEFT PANEL
========================= */

.controlPanel{
    position:absolute;
    left:15px;
    top:15px;
    width:250px;
    padding:15px;
    border-radius:14px;
    background:#0f172af2;
    color:#fff;
    z-index:500;
    box-shadow:0 10px 30px #0005;
}

.controlPanel h3{
    color:#fbbf24;
    margin-bottom:10px;
}

.controlPanel button{
    width:100%;
    padding:10px;
    border-radius:8px;
    margin-top:7px;
    color:#fff;
}

.stockBtn{background:#16a34a}
.upgradeBtn{background:#2563eb}
.employeeBtn{background:#7c3aed}
.businessBtn{background:#f59e0b;color:#111!important}
.inventoryBtn{background:#475569}

/* =========================
   CUSTOMER PANEL
========================= */

.customerPanel{
    position:absolute;
    right:15px;
    bottom:15px;
    width:285px;
    max-height:360px;
    overflow:auto;
    z-index:500;
}

.customerCard{
    padding:12px;
    margin-top:8px;
    border-radius:12px;
    background:#fff;
    color:#111827;
    box-shadow:0 5px 20px #0005;
}

.customerCard strong{
    display:block;
    margin-bottom:4px;
}

.customerNeed{
    color:#475569;
    font-size:13px;
    margin-bottom:8px;
}

.serveBtn{
    background:#16a34a;
    color:#fff;
    padding:8px 12px;
    border-radius:7px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

.modalBox{
    width:min(720px,92vw);
    max-height:88vh;
    overflow:auto;
    background:#f8fafc;
    color:#111827;
    padding:25px;
    border-radius:18px;
}

.closeBtn{
    float:right;
    background:#dc2626;
    color:#fff;
    padding:8px 12px;
    border-radius:7px;
}

.modalBox h2{
    margin-bottom:15px;
}

.modalButton{
    width:100%;
    padding:13px;
    margin-top:9px;
    border-radius:9px;
    color:#fff;
    background:#2563eb;
}

/* =========================
   TABLE
========================= */

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:9px;
    border-bottom:1px solid #cbd5e1;
    text-align:left;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    padding:14px 20px;
    border-radius:12px;
    background:#020617;
    color:#fff;
    z-index:20000;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

#toast.show{
    opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .topbar{
        height:auto;
        min-height:68px;
        flex-wrap:wrap;
    }

    .logo{
        width:100%;
        text-align:center;
    }

    #world{
        height:calc(100vh - 125px);
    }

    .shop{
        width:92vw;
        height:440px;
        top:10%;
    }

    .controlPanel{
        width:190px;
        transform:scale(.85);
        transform-origin:top left;
    }

    .customerPanel{
        width:210px;
        transform:scale(.85);
        transform-origin:bottom right;
    }

    .stat{
        font-size:11px;
    }

    .uiBtn{
        font-size:11px;
        padding:8px;
    }
}
</style>
</head>

</div>

Shop:

</div>

Employees:

</div>

<button

</button>

    class="employeeBtn"

👨‍💼 HIRE EMPLOYEE
</button>

<button
    class="businessBtn"
    onclick="buyBusiness()">
🏪 BUY BUSINESS
</button>

<button
    class="inventoryBtn"
    onclick="openInventory()">
📋 INVENTORY
</button>

</div>


<!-- CUSTOMER PANEL -->

<div
    id="customerPanel"
    class="customerPanel">
</div>

</div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modal"
    class="modal hidden">

<div class="modalBox">

<button
    class="closeBtn"
    onclick="closeModal()">
CLOSE
</button>

<div id="modalContent"></div>

</div>

</div>


<div id="toast"></div>

/* =====================================================
   GAME STATE
===================================================== */

let player=null;

let customers=[];

let customerNumber=0;

let customerLoop=null;

let gameLoop=null;

let clockLoop=null;

let day=1;

let hour=8;

let minute=0;


/* =====================================================
   ACCOUNT STORAGE
===================================================== */

function getAccounts(){

    return JSON.parse(
        localStorage.getItem(
            "THE_LAST_SHOP_ACCOUNTS"
        ) || "{}"
    );

}


function saveAccounts(accounts){

    localStorage.setItem(
        "THE_LAST_SHOP_ACCOUNTS",
        JSON.stringify(accounts)
    );

}


function saveGame(){

    if(!player)return;

    const accounts=getAccounts();

    accounts[player.username]=player;

    saveAccounts(accounts);

}


/* =====================================================
   CREATE ACCOUNT
===================================================== */

function createAccount(){

    const name=
        document.getElementById(
            "nameInput"
        ).value.trim();

    const password=
        document.getElementById(
            "passwordInput"
        ).value;

    const shop=
        document.getElementById(
            "shopInput"
        ).value.trim();


    if(!name||!password||!shop){

        loginMessage(
            "Please complete all fields."
        );

        return;

    }


    const accounts=getAccounts();


    if(accounts[name]){

        loginMessage(
            "That account already exists."
        );

        return;

    }


    player={

        username:name,

        password:password,

        shopName:shop,

        money:5000,

        level:1,

        stock:0,

        employees:0,

        businesses:1,

        shopValue:5000,

        sales:0,

        customersServed:0,

        adRewards:0,

        purchases:0,

        days:1,

        reputation:50,

        inventory:{}

    };


    PRODUCTS.forEach(p=>{

        player.inventory[p.id]=
            Math.floor(
                Math.random()*4
            );

        player.stock +=
            player.inventory[p.id];

    });


    accounts[name]=player;

    saveAccounts(accounts);


    localStorage.setItem(
        "THE_LAST_SHOP_USER",
        name
    );


    startGame();

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const name=
        document.getElementById(
            "nameInput"
        ).value.trim();

    const password=
        document.getElementById(
            "passwordInput"
        ).value;


    const accounts=getAccounts();


    if(
        !accounts[name]||
        accounts[name].password!==password
    ){

        loginMessage(
            "Wrong name or password."
        );

        return;

    }


    player=accounts[name];


    localStorage.setItem(
        "THE_LAST_SHOP_USER",
        name
    );


    startGame();

}


function loginMessage(text){

    document.getElementById(
        "loginMessage"
    ).textContent=text;

}


/* =====================================================
   START
===================================================== */

function startGame(){

    document.getElementById(
        "loginScreen"
    ).classList.add("hidden");


    document.getElementById(
        "game"
    ).classList.remove("hidden");


    document.getElementById(
        "owner"
    ).textContent=
        player.username;


    document.getElementById(
        "shopOwnerName"
    ).textContent=
        player.shopName;


    document.getElementById(
        "shopNameDisplay"
    ).textContent=
        player.shopName;


    document.getElementById(
        "playerNameTag"
    ).textContent=
        player.username;


    renderAll();

    positionPlayer();

    startLoops();

    showToast(
        "Welcome to "+player.shopName+"!"
    );

}


function startLoops(){

    clearInterval(customerLoop);
    clearInterval(gameLoop);
    clearInterval(clockLoop);


    customerLoop=
        setInterval(
            spawnCustomer,
            3500
        );


    gameLoop=
        setInterval(
            simulationTick,
            3000
        );


    clockLoop=
        setInterval(
            advanceTime,
            4000
        );


    setTimeout(
        spawnCustomer,
        900
    );

    setTimeout(
        spawnCustomer,
        1800
    );

    setTimeout(
        spawnCustomer,
        3000
    );

}


/* =====================================================
   PLAYER
===================================================== */

function positionPlayer(){

    const el=
        document.getElementById(
            "playerCharacter"
        );

    el.style.left="47%";
    el.style.top="66%";

}


function playerAtCheckout(){

    const el=
        document.getElementById(
            "playerCharacter"
        );

    el.style.left="47%";
    el.style.top="56%";

}


/* =====================================================
   CUSTOMERS
===================================================== */

function spawnCustomer(){

    if(customers.length>=10)return;


    const product=
        PRODUCTS[
            Math.floor(
                Math.random()*
                PRODUCTS.length
            )
        ];


    const customer={

        id:++customerNumber,

        name:
            NAMES[
                Math.floor(
                    Math.random()*
                    NAMES.length
                )
            ],

        product:product,

        shirt:
            SHIRTS[
                Math.floor(
                    Math.random()*
                    SHIRTS.length
                )
            ],

        age:0,

        state:"entering",

        served:false

    };


    customers.push(customer);


    createCustomer(customer);

    renderCustomers();

    updateCustomerCount();


    setTimeout(()=>{

        moveCustomer(
            customer.id,
            "aisle"
        );

    },500);

}


function createCustomer(c){

    const layer=
        document.getElementById(
            "customersLayer"
        );


    const el=
        document.createElement(
            "div"
        );


    el.className="customer";

    el.id="customer-"+c.id;


    el.style.left=
        (10+Math.random()*80)+"%";

    el.style.top="72%";


    el.innerHTML=`

        <div class="customerHair"></div>

        <div class="customerHead">
        </div>

        <div
            class="customerBody"
            style="background:${c.shirt}">
        </div>

        <div class="customerArm ca1"></div>
        <div class="customerArm ca2"></div>

        <div class="customerLeg cl1"></div>
        <div class="customerLeg cl2"></div>

        <div class="customerName">
            ${c.name}
        </div>

    `;


    layer.appendChild(el);

}


function moveCustomer(id,state){

    const c=
        customers.find(
            x=>x.id===id
        );

    if(!c)return;


    const el=
        document.getElementById(
            "customer-"+id
        );

    if(!el)return;


    c.state=state;


    if(state==="aisle"){

        el.style.left=
            (25+Math.random()*50)+"%";

        el.style.top=
            (36+Math.random()*18)+"%";

    }


    if(state==="checkout"){

        el.style.left=
            (47+Math.random()*5)+"%";

        el.style.top="58%";

    }


    if(state==="exit"){

        el.style.left=
            (Math.random()>0.5?
             "105%":"-10%");

        el.style.top="70%";

    }

}


/* =====================================================
   SERVE
===================================================== */

function serveCustomer(id){

    const c=
        customers.find(
            x=>x.id===id
        );


    if(!c)return;


    const amount=
        player.inventory[c.product.id]||0;


    if(amount<=0){

        showToast(
            c.product.icon+
            " "+c.product.name+
            " is OUT OF STOCK!"
        );

        return;

    }


    playerAtCheckout();

    moveCustomer(
        id,
        "checkout"
    );


    setTimeout(()=>{

        player.inventory[
            c.product.id
        ]--;


        player.stock--;


        player.money +=
            c.product.sell;


        player.sales +=
            c.product.sell;


        player.customersServed++;

        player.reputation=
            Math.min(
                100,
                player.reputation+1
            );


        c.served=true;


        renderAll();


        showToast(
            c.name+
            " bought "+
            c.product.name+
            " for $"+
            c.product.sell
        );


        setTimeout(()=>{

            moveCustomer(
                id,
                "exit"
            );

        },700);


        setTimeout(()=>{

            removeCustomer(id);

        },1800);


        setTimeout(
            positionPlayer,
            1000
        );


        saveGame();

    },1000);

}


/* =====================================================
   CUSTOMER PANEL
===================================================== */

function renderCustomers(){

    const panel=
        document.getElementById(
            "customerPanel"
        );


    panel.innerHTML="";


    customers.forEach(c=>{

        const card=
            document.createElement(
                "div"
            );


        card.className=
            "customerCard";


        card.innerHTML=`

            <strong>
                🧍 ${c.name}
            </strong>

            <div class="customerNeed">

                Wants:
                ${c.product.icon}
                ${c.product.name}

            </div>

            <button
                class="serveBtn"
                onclick="serveCustomer(${c.id})">

                SERVE CUSTOMER

            </button>

        `;


        panel.appendChild(card);

    });

}


function removeCustomer(id){

    customers=
        customers.filter(
            c=>c.id!==id
        );


    const el=
        document.getElementById(
            "customer-"+id
        );


    if(el)el.remove();


    renderCustomers();

    updateCustomerCount();

}


function updateCustomerCount(){

    document.getElementById(
        "served"
    ).textContent=
        player.customersServed;

}


/* =====================================================
   STOCK
===================================================== */

function orderStock(){

    const cost=500;


    if(player.money<cost){

        openMoney();

        showToast(
            "You need more shop money."
        );

        return;

    }


    player.money-=cost;


    PRODUCTS.forEach(p=>{

        const quantity=
            4+
            Math.floor(
                Math.random()*4
            );


        player.inventory[p.id]=
            (player.inventory[p.id]||0)+
            quantity;


        player.stock+=quantity;

    });


    renderAll();

    saveGame();


    showToast(
        "🚚 Delivery arrived. Shelves restocked!"
    );

}


/* =====================================================
   SHOP UPGRADE
===================================================== */

function upgradeShop(){

    const cost=
        2000*player.level;


    if(player.money<cost){

        showToast(
            "Upgrade costs $"+cost
        );

        return;

    }


    player.money-=cost;

    player.level++;

    player.shopValue+=
        cost*2;

    player.reputation=
        Math.min(
            100,
            player.reputation+5
        );


    renderAll();

    saveGame();


    showToast(
        "🏗️ Shop upgraded to level "+
        player.level
    );

}


/* =====================================================
   EMPLOYEES
===================================================== */

function hireEmployee(){

    const cost=
        1200+
        player.employees*700;


    if(player.money<cost){

        showToast(
            "Employee costs $"+cost
        );

        return;

    }


    player.money-=cost;

    player.employees++;


    renderAll();

    saveGame();


    showToast(
        "👨‍💼 New employee hired!"
    );

}


/* =====================================================
   OTHER BUSINESSES
===================================================== */

function buyBusiness(){

    const cost=
        10000*
        player.businesses;


    if(player.money<cost){

        showToast(
            "Next business costs $"+cost
        );

        return;

    }


    player.money-=cost;

    player.businesses++;

    player.shopValue+=cost;


    renderAll();

    saveGame();


    if(player.businesses===2){

        showToast(
            "🏪 You bought your second shop!"
        );

    }else if(player.businesses===3){

        showToast(
            "🚗 Your business empire is growing!"
        );

    }else{

        showToast(
            "🏢 New business purchased!"
        );

    }

}


/* =====================================================
   EMPLOYEE SIMULATION
===================================================== */

function simulationTick(){

    if(
        player.employees>0 &&
        customers.length>0
    ){

        const chance=
            Math.min(
                .8,
                player.employees*.10
            );


        if(
            Math.random()<chance
        ){

            const waiting=
                customers.find(
                    c=>
                    c.state==="aisle"
                    &&
                    !c.served
                );


            if(waiting){

                serveCustomer(
                    waiting.id
                );

            }

        }

    }


    customers.forEach(c=>{

        c.age++;

    });


    customers
        .filter(c=>c.age>35)
        .forEach(c=>{

            removeCustomer(c.id);

        });


    saveGame();

}

/* =====================================================
   DAY / NIGHT
===================================================== */

function advanceTime(){

    minute+=15;


    if(minute>=60){

        minute=0;

        hour++;

    }


    if(hour>=24){

        hour=0;

        day++;

        player.days=day;

    }


    updateWorldLighting();

}


function updateWorldLighting(){

    const world=
        document.getElementById(
            "world"
        );


    if(hour>=20||hour<6){

        world.style.filter=
            "brightness(.62)";

    }else if(hour>=18){

        world.style.filter=
            "brightness(.8)";

    }else{

        world.style.filter=
            "brightness(1)";

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderAll(){

    document.getElementById(
        "money"
    ).textContent=
        Math.floor(player.money);


    document.getElementById(
        "stock"
    ).textContent=
        player.stock;


    document.getElementById(
        "level"
    ).textContent=
        player.level;


    document.getElementById(
        "served"
    ).textContent=
        player.customersServed;


    document.getElementById(
        "employees"
    ).textContent=
        player.employees;


    document.getElementById(
        "businesses"
    ).textContent=
        player.businesses;


    renderShelves();

    renderCustomers();

}


/* =====================================================
   SHELVES
===================================================== */

function renderShelves(){

    const shelves=[

        document.getElementById(
            "shelf1Items"
        ),

        document.getElementById(
            "shelf2Items"
        ),

        document.getElementById(
            "shelf3Items"
        )

    ];


    shelves.forEach(s=>{

        s.innerHTML="";

    });


    let index=0;


    PRODUCTS.forEach(p=>{

        const amount=
            player.inventory[p.id]||0;


        for(
            let i=0;
            i<Math.min(amount,8);
            i++
        ){

            const item=
                document.createElement(
                    "div"
                );


            item.className="item";

            item.textContent=p.icon;

            item.title=
                p.name+
                " - $"+
                p.sell;


            shelves[
                index%3
            ].appendChild(item);


            index++;

        }

    });

}

function closeModal(){

function showToast(message){

    const toast=
        document.getElementById(
            "toast"
        );


    toast.textContent=message;

    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer=
        setTimeout(()=>{

            toast.classList.remove("show");

        },3000);

}

   LOGOUT
===================================================== */

function logout(){

    saveGame();


    clearInterval(customerLoop);
    clearInterval(gameLoop);
    clearInterval(clockLoop);


    customers=[];


    document.getElementById(
        "customersLayer"
    ).innerHTML="";


    player=null;


    document.getElementById(
        "game"
    ).classList.add("hidden");


    document.getElementById(
        "loginScreen"
    ).classList.remove("hidden");
