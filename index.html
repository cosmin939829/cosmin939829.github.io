<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Last Shop</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#dce5ee;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#f5eee8;
}

/* TOP BAR */
#topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:74px;
    background:linear-gradient(#244e80,#173a64);
    border-bottom:4px solid #102d4c;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    color:white;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
    color:#ffd85a;
    text-shadow:2px 2px #15243a;
}

.stats{
    display:flex;
    gap:10px;
    align-items:center;
}

.stat{
    min-width:90px;
    padding:9px 13px;
    background:#102d4c;
    border:2px solid #557ba6;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
}

.stat small{
    display:block;
    font-size:10px;
    opacity:.75;
    margin-bottom:2px;
}

#pauseBtn{
    background:#f1b73b;
    color:#2c2414;
    border:0;
    border-radius:9px;
    padding:10px 14px;
    font-weight:bold;
    cursor:pointer;
}

/* GAME WORLD */
#world{
    position:absolute;
    top:74px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:
      linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px),
      #ead6cb;
    background-size:38px 38px;
}

/* WALL */
.wall{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:55%;
    background:
      linear-gradient(rgba(170,105,82,.10) 1px,transparent 1px),
      linear-gradient(90deg,rgba(170,105,82,.10) 1px,transparent 1px),
      #f0ddd2;
    background-size:38px 38px;
    border-bottom:8px solid #7e4b43;
}

/* FLOOR */
.floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:45%;
    background:
      linear-gradient(90deg,rgba(110,70,50,.08) 1px,transparent 1px),
      linear-gradient(rgba(110,70,50,.08) 1px,transparent 1px),
      #cba98d;
    background-size:55px 55px;
    border-top:5px solid #815c4b;
}

/* SHOP SIGN */
.shopSign{
    position:absolute;
    top:28px;
    left:50%;
    transform:translateX(-50%);
    background:#6d402f;
    color:#ffd35b;
    border:4px solid #4c3027;
    border-radius:7px;
    padding:12px 35px;
    font-weight:900;
    font-size:20px;
    letter-spacing:2px;
    box-shadow:0 5px 10px #0003;
}

/* WINDOWS */
.window{
    position:absolute;
    top:25px;
    width:92px;
    height:70px;
    background:linear-gradient(#5cb4ef,#b8e6ff);
    border:7px solid #634d4a;
    box-shadow:inset 0 0 0 3px #ffffff55;
}

.window:before,
.window:after{
    content:"";
    position:absolute;
    background:#634d4a;
}

.window:before{
    width:6px;
    height:100%;
    left:50%;
    transform:translateX(-50%);
}

.window:after{
    height:6px;
    width:100%;
    top:50%;
    transform:translateY(-50%);
}

.window.left{left:55px;}
.window.right{right:55px;}

/* SHELVES */
.shelf{
    position:absolute;
    background:#a85f49;
    border:5px solid #6d3d36;
    border-radius:8px;
    box-shadow:0 7px 12px #0004;
    z-index:8;
}

.shelf .shelfTitle{
    position:absolute;
    top:-28px;
    left:4px;
    color:#713b35;
    font-size:13px;
    font-weight:900;
}

.foodShelf{
    left:8%;
    top:34%;
    width:35%;
    height:92px;
}

.supplyShelf{
    right:8%;
    top:34%;
    width:35%;
    height:92px;
}

.item{
    position:absolute;
    bottom:15px;
    width:47px;
    height:47px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 3px 5px #0004;
    border:2px solid #ffffff55;
}

.item span{
    position:absolute;
    bottom:-19px;
    background:#242424;
    color:#fff;
    font-size:11px;
    padding:2px 5px;
    border-radius:4px;
    white-space:nowrap;
}

.item.food1{left:8%;background:#ef4141;}
.item.food2{left:42%;background:#ffc51f;}
.item.food3{left:75%;background:#59a9e9;}

.item.sup1{left:10%;background:#8665e8;}
.item.sup2{left:44%;background:#f4a335;}
.item.sup3{left:77%;background:#35c8b4;}

/* COUNTER */
.counter{
    position:absolute;
    left:31%;
    right:31%;
    top:59%;
    height:78px;
    background:#a85f49;
    border:6px solid #6d3d36;
    border-radius:8px;
    box-shadow:0 7px 12px #0004;
    z-index:20;
}

.counter:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:-16px;
    height:10px;
    background:#65443b;
}

/* CASH REGISTER */
.register{
    position:absolute;
    width:55px;
    height:43px;
    right:30px;
    top:12px;
    border-radius:8px;
    background:#3f596d;
    border:3px solid #263c4e;
    color:#6aff7e;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:19px;
}

/* CUSTOMER LANE */
.customerLane{
    position:absolute;
    left:4%;
    right:4%;
    top:77%;
    height:4px;
    background:#8a604d55;
}

/* PLAYER */
#player{
    position:absolute;
    left:50%;
    top:68%;
    width:58px;
    height:100px;
    transform:translateX(-50%);
    z-index:50;
    transition:left .25s linear,top .25s linear;
}

.playerLabel{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    background:#1e73db;
    color:#fff;
    padding:3px 8px;
    border-radius:8px;
    font-size:10px;
    font-weight:bold;
}

/* HUMAN CHARACTER */
.human{
    position:absolute;
    width:58px;
    height:100px;
    z-index:45;
    transition:left .2s linear,top .2s linear;
}

.human .head{
    position:absolute;
    width:36px;
    height:36px;
    left:11px;
    top:0;
    background:#f1b28f;
    border:2px solid #8f5e4d;
    border-radius:50%;
    z-index:4;
}

.human .hair{
    position:absolute;
    width:37px;
    height:17px;
    left:10px;
    top:-1px;
    border-radius:20px 20px 8px 8px;
    z-index:6;
}

.human .eye{
    position:absolute;
    width:4px;
    height:5px;
    background:#292929;
    border-radius:50%;
    top:15px;
    z-index:8;
}

.human .eye.left{left:20px;}
.human .eye.right{left:32px;}

.human .nose{
    position:absolute;
    width:3px;
    height:5px;
    background:#b97862;
    top:20px;
    left:28px;
    z-index:8;
}

.human .mouth{
    position:absolute;
    width:11px;
    height:5px;
    left:23px;
    top:26px;
    border-bottom:2px solid #813f3b;
    border-radius:0 0 10px 10px;
    z-index:8;
}

.human .body{
    position:absolute;
    width:34px;
    height:42px;
    left:12px;
    top:34px;
    border-radius:9px 9px 5px 5px;
    border:2px solid #3335;
}

.human .arm{
    position:absolute;
    width:11px;
    height:35px;
    top:38px;
    border-radius:8px;
    background:#f1b28f;
    border:1px solid #8f5e4d;
    z-index:1;
}

.human .arm.left{
    left:5px;
    transform:rotate(7deg);
}

.human .arm.right{
    right:5px;
    transform:rotate(-7deg);
}

.human .leg{
    position:absolute;
    width:12px;
    height:31px;
    top:73px;
    background:#26364b;
    border-radius:5px;
    z-index:0;
}

.human .leg.left{left:15px;}
.human .leg.right{left:32px;}

.human .shoe{
    position:absolute;
    width:19px;
    height:8px;
    background:#252525;
    border-radius:8px;
    top:96px;
}

.human .shoe.left{left:8px;}
.human .shoe.right{left:31px;}

/* CHARACTER TYPES */
.male1 .hair{background:#382b27;}
.male1 .body{background:#3f76c8;}

.male2 .hair{background:#171717;}
.male2 .body{background:#45a37b;}

.female1 .hair{
    background:#542c20;
    height:29px;
    border-radius:20px 20px 14px 14px;
}
.female1 .body{background:#d8569d;}

.female2 .hair{
    background:#d6a13c;
    height:27px;
    border-radius:20px;
}
.female2 .body{background:#7659d5;}

.worker .hair{background:#493226;}
.worker .body{background:#f29b31;}

/* WALK ANIMATION */
.walking .leg.left{
    animation:walkLeft .25s infinite alternate;
}

.walking .leg.right{
    animation:walkRight .25s infinite alternate;
}

.walking .arm.left{
    animation:armLeft .25s infinite alternate;
}

.walking .arm.right{
    animation:armRight .25s infinite alternate;
}

@keyframes walkLeft{
    from{transform:rotate(12deg);}
    to{transform:rotate(-12deg);}
}

@keyframes walkRight{
    from{transform:rotate(-12deg);}
    to{transform:rotate(12deg);}
}

@keyframes armLeft{
    from{transform:rotate(-12deg);}
    to{transform:rotate(12deg);}
}

@keyframes armRight{
    from{transform:rotate(12deg);}
    to{transform:rotate(-12deg);}
}

/* SPEECH */
.speech{
    position:absolute;
    min-width:145px;
    max-width:210px;
    padding:10px 12px;
    background:white;
    border:2px solid #b8b8b8;
    border-radius:13px;
    color:#292929;
    font-size:12px;
    font-weight:bold;
    box-shadow:0 4px 12px #0003;
    z-index:90;
    animation:pop .25s ease-out;
}

.speech:after{
    content:"";
    position:absolute;
    bottom:-9px;
    left:22px;
    width:15px;
    height:15px;
    background:white;
    border-right:2px solid #b8b8b8;
    border-bottom:2px solid #b8b8b8;
    transform:rotate(45deg);
}

@keyframes pop{
    from{transform:scale(.6);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

/* CUSTOMER PANEL */
#customerPanel{
    position:absolute;
    right:12px;
    bottom:15px;
    width:270px;
    max-height:50%;
    overflow:auto;
    z-index:110;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.customerCard{
    background:#fff;
    border:2px solid #d6d6d6;
    border-radius:13px;
    padding:9px;
    box-shadow:0 5px 12px #0003;
    display:grid;
    grid-template-columns:42px 1fr;
    gap:7px;
}

.customerAvatar{
    width:40px;
    height:40px;
    border-radius:50%;
    overflow:hidden;
    position:relative;
    border:2px solid #aaa;
    background:#f1b28f;
}

.customerAvatar:before{
    content:"";
    position:absolute;
    width:100%;
    height:45%;
    top:0;
    background:#3c2a22;
    border-radius:50%;
}

.customerInfo b{
    display:block;
    font-size:13px;
}

.customerInfo span{
    display:block;
    color:#555;
    font-size:11px;
    margin:3px 0;
}

.serveBtn{
    background:#19c967;
    border:0;
    color:white;
    font-weight:900;
    padding:7px;
    width:100%;
    border-radius:8px;
    cursor:pointer;
}

.serveBtn:hover{
    background:#12ae57;
}

/* MENU */
#menu{
    position:absolute;
    left:15px;
    top:95px;
    z-index:120;
    width:190px;
    background:#fff;
    border:2px solid #c8c8c8;
    border-radius:14px;
    padding:12px;
    box-shadow:0 8px 20px #0003;
}

#menu h3{
    margin:0 0 8px;
    color:#244e80;
}

.menuButton{
    width:100%;
    margin:4px 0;
    padding:9px;
    border:0;
    border-radius:8px;
    background:#edf2f7;
    cursor:pointer;
    font-weight:bold;
}

.menuButton:hover{
    background:#dce8f5;
}

/* NOTIFICATION */
#notification{
    position:absolute;
    left:50%;
    top:90px;
    transform:translateX(-50%);
    background:#1d2d40;
    color:white;
    padding:11px 20px;
    border-radius:20px;
    z-index:300;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    font-weight:bold;
}

#notification.show{
    opacity:1;
}

/* FLOATING MONEY */
.moneyFloat{
    position:absolute;
    color:#13a94e;
    font-weight:900;
    font-size:20px;
    z-index:200;
    animation:moneyUp 1s forwards;
    pointer-events:none;
}

@keyframes moneyUp{
    0%{opacity:1;transform:translateY(0);}
    100%{opacity:0;transform:translateY(-65px);}
}

/* UPGRADES */
#upgradeBox{
    position:absolute;
    left:15px;
    bottom:15px;
    z-index:130;
    background:white;
    border:2px solid #ccc;
    border-radius:12px;
    padding:10px;
    width:190px;
    box-shadow:0 5px 12px #0003;
}

#upgradeBox b{
    color:#244e80;
}

.upgradeBtn{
    width:100%;
    margin-top:5px;
    padding:7px;
    border:0;
    border-radius:7px;
    background:#f1b73b;
    cursor:pointer;
    font-weight:bold;
}

/* DAY MESSAGE */
#dayMessage{
    position:absolute;
    inset:0;
    background:#102d4cd9;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
}

.dayCard{
    background:#fff;
    padding:35px;
    border-radius:20px;
    text-align:center;
    width:330px;
    box-shadow:0 15px 40px #0006;
}

.dayCard h1{
    color:#244e80;
}

.dayCard button{
    background:#19c967;
    color:white;
    border:0;
    padding:12px 30px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* RESPONSIVE */
@media(max-width:800px){
    #menu{
        transform:scale(.8);
        transform-origin:top left;
    }

    .logo{
        font-size:15px;
    }

    .stat{
        min-width:60px;
        padding:6px;
        font-size:11px;
    }

    #customerPanel{
        width:220px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="topbar">
        <div class="logo">🏪 THE LAST SHOP</div>

        <div class="stats">
            <div class="stat">
                <small>MONEY</small>
                £<span id="money">100</span>
            </div>

            <div class="stat">
                <small>CUSTOMERS</small>
                <span id="served">0</span>
            </div>

            <div class="stat">
                <small>DAY</small>
                <span id="day">1</span>
            </div>

            <div class="stat">
                <small>TIME</small>
                <span id="clock">08:00</span>
            </div>

            <button id="pauseBtn" onclick="togglePause()">Ⅱ</button>
        </div>
    </div>

    <div id="world">

        <div class="wall"></div>
        <div class="floor"></div>

        <div class="window left"></div>
        <div class="window right"></div>

        <div class="shopSign">THE LAST SHOP</div>

        <!-- FOOD -->
        <div class="shelf foodShelf">
            <div class="shelfTitle">🍎 FOOD</div>

            <div class="item food1">
                🥫
                <span>£2</span>
            </div>

            <div class="item food2">
                🍞
                <span>£3</span>
            </div>

            <div class="item food3">
                🥛
                <span>£3</span>
            </div>
        </div>

        <!-- SUPPLIES -->
        <div class="shelf supplyShelf">
            <div class="shelfTitle">🧰 SUPPLIES</div>

            <div class="item sup1">
                🧼
                <span>£4</span>
            </div>

            <div class="item sup2">
                🔨
                <span>£7</span>
            </div>

            <div class="item sup3">
                🧽
                <span>£4</span>
            </div>
        </div>

        <!-- COUNTER -->
        <div class="counter">
            <div class="register">£</div>
        </div>

        <div class="customerLane"></div>

        <!-- PLAYER -->
        <div id="player">
            <div class="playerLabel">YOU</div>

            <div class="human worker">
                <div class="head"></div>
                <div class="hair"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
                <div class="mouth"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="body"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
                <div class="shoe left"></div>
                <div class="shoe right"></div>
            </div>
        </div>

        <div id="characters"></div>

    </div>

    <!-- LEFT MENU -->
    <div id="menu">
        <h3>🏪 Shop</h3>

        <button class="menuButton" onclick="restock()">
            📦 Restock Shop
        </button>

        <button class="menuButton" onclick="openShop()">
            🚪 Open / Close Shop
        </button>

        <button class="menuButton" onclick="callCustomer()">
            👥 Call Customer
        </button>

        <button class="menuButton" onclick="talkToNearest()">
            💬 Talk to Customer
        </button>
    </div>

    <!-- UPGRADES -->
    <div id="upgradeBox">
        <b>⬆️ UPGRADES</b>

        <button class="upgradeBtn" onclick="upgradeShop()">
            ⭐ Upgrade Shop — £50
        </button>

        <button class="upgradeBtn" onclick="upgradeService()">
            ⚡ Faster Service — £40
        </button>

        <button class="upgradeBtn" onclick="upgradeAttraction()">
            👥 More Customers — £60
        </button>
    </div>

    <!-- CUSTOMER CARDS -->
    <div id="customerPanel"></div>

    <!-- NOTIFICATION -->
    <div id="notification"></div>

    <!-- DAY SCREEN -->
    <div id="dayMessage">
        <div class="dayCard">
            <h1>🌙 Shop Closed</h1>
            <p id="daySummary"></p>
            <button onclick="nextDay()">START NEXT DAY</button>
        </div>
    </div>

</div>

<script>

/* =========================================================
   THE LAST SHOP
   COMPLETE SINGLE FILE GAME
   ========================================================= */

let money = 100;
let served = 0;
let day = 1;

let shopOpen = true;
let paused = false;

let shopLevel = 1;
let serviceLevel = 1;
let attractionLevel = 1;

let hour = 8;
let minute = 0;

let customerId = 0;

const customers = [];

const names = [
    "Lucy","Mike","Tom","Emma","David",
    "Sarah","James","Sophie","Daniel",
    "Olivia","Jack","Emily","Noah","Amelia"
];

const requests = [
    {item:"soap",emoji:"🧼",price:4},
    {item:"bread",emoji:"🍞",price:3},
    {item:"milk",emoji:"🥛",price:3},
    {item:"food",emoji:"🥫",price:2},
    {item:"hammer",emoji:"🔨",price:7},
    {item:"sponge",emoji:"🧽",price:4}
];

const conversations = [
    ["Hi!", "Hello! Are you shopping here too?"],
    ["This shop is nice.", "Yes, I like it!"],
    ["Do you know where the soap is?", "I think it's on that shelf."],
    ["The bread looks fresh.", "I might get some too."],
    ["It's busy today!", "Yes! There are lots of customers."],
    ["Have you been here before?", "No, this is my first time."],
    ["I'm looking for something.", "What do you need?"],
    ["I need some supplies.", "The supplies are over there."]
];

const characterTypes = [
    "male1",
    "male2",
    "female1",
    "female2"
];

const charactersEl = document.getElementById("characters");
const customerPanel = document.getElementById("customerPanel");

/* =========================================================
   BASIC UI
   ========================================================= */

function updateHUD(){

    document.getElementById("money").textContent =
        Math.floor(money);

    document.getElementById("served").textContent =
        served;

    document.getElementById("day").textContent =
        day;

    document.getElementById("clock").textContent =
        String(hour).padStart(2,"0") + ":" +
        String(minute).padStart(2,"0");
}

function notify(message){

    const box = document.getElementById("notification");

    box.textContent = message;
    box.classList.add("show");

    clearTimeout(box.timer);

    box.timer = setTimeout(()=>{
        box.classList.remove("show");
    },2200);
}

/* =========================================================
   MONEY
   ========================================================= */

function addMoney(amount,x=50,y=60){

    money += amount;

    const el = document.createElement("div");

    el.className = "moneyFloat";
    el.textContent = "+£" + amount;

    el.style.left = x + "%";
    el.style.top = y + "%";

    document.getElementById("world").appendChild(el);

    setTimeout(()=>{
        el.remove();
    },1000);

    updateHUD();
}

/* =========================================================
   CREATE HUMAN
   ========================================================= */

function createHuman(type="male1"){

    const human = document.createElement("div");

    human.className = "human " + type;

    human.innerHTML = `
        <div class="head"></div>
        <div class="hair"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="body"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="shoe left"></div>
        <div class="shoe right"></div>
    `;

    return human;
}

/* =========================================================
   CUSTOMER CREATION
   ========================================================= */

function createCustomer(){

    if(!shopOpen || paused) return;

    const maxCustomers =
        3 + attractionLevel * 2;

    if(customers.length >= maxCustomers){
        return;
    }

    customerId++;

    const name =
        names[Math.floor(Math.random()*names.length)];

    const request =
        requests[Math.floor(Math.random()*requests.length)];

    const type =
        characterTypes[
            Math.floor(Math.random()*characterTypes.length)
        ];

    const customer = {

        id:customerId,

        name:name,

        request:request,

        type:type,

        x:Math.random()*70+10,

        y:70,

        state:"entering",

        served:false,

        element:null,

        speech:null,

        speed:0.15 + Math.random()*0.08
    };

    customers.push(customer);

    const human = createHuman(type);

    human.style.left = customer.x + "%";
    human.style.top = customer.y + "%";

    human.classList.add("walking");

    charactersEl.appendChild(human);

    customer.element = human;

    updateCustomerPanel();

    walkCustomer(customer);
}

/* =========================================================
   CUSTOMER WALKING
   ========================================================= */

function walkCustomer(customer){

    if(customer.served || paused) return;

    customer.x += customer.speed;

    if(customer.x >= 78){

        customer.x = 72;

        customer.state = "shopping";

        customer.element.classList.remove("walking");

        showSpeech(
            customer,
            "Hi! I need " +
            customer.request.item +
            " " +
            customer.request.emoji
        );

        setTimeout(()=>{

            if(customer.served) return;

            customer.state = "waiting";

            showSpeech(
                customer,
                "Can someone help me please?"
            );

            updateCustomerPanel();

        },1700);

        return;
    }

    customer.element.style.left =
        customer.x + "%";

    setTimeout(()=>{
        walkCustomer(customer);
    },100);
}

/* =========================================================
   SPEECH
   ========================================================= */

function showSpeech(customer,text,duration=2800){

    if(customer.speech){
        customer.speech.remove();
    }

    const bubble =
        document.createElement("div");

    bubble.className = "speech";
    bubble.textContent = text;

    bubble.style.left =
        customer.x + "%";

    bubble.style.top =
        (customer.y - 7) + "%";

    document.getElementById("world")
        .appendChild(bubble);

    customer.speech = bubble;

    setTimeout(()=>{

        if(bubble.parentNode){
            bubble.remove();
        }

        if(customer.speech === bubble){
            customer.speech = null;
        }

    },duration);
}

/* =========================================================
   CUSTOMER CONVERSATIONS
   ========================================================= */

function customerConversation(){

    const active =
        customers.filter(c =>
            !c.served &&
            c.state !== "entering"
        );

    if(active.length < 2) return;

    const a = active[
        Math.floor(Math.random()*active.length)
    ];

    let b = active[
        Math.floor(Math.random()*active.length)
    ];

    if(a === b) return;

    const conversation =
        conversations[
            Math.floor(Math.random()*conversations.length)
        ];

    showSpeech(a,conversation[0],2500);

    setTimeout(()=>{

        if(!b.served){
            showSpeech(b,conversation[1],2500);
        }

    },1400);
}

/* =========================================================
   CUSTOMER PANEL
   ========================================================= */

function updateCustomerPanel(){

    customerPanel.innerHTML = "";

    customers
        .filter(c=>!c.served)
        .forEach(customer=>{

            const card =
                document.createElement("div");

            card.className = "customerCard";

            card.innerHTML = `
                <div class="customerAvatar"></div>

                <div class="customerInfo">
                    <b>${customer.name}</b>

                    <span>
                        ${customer.request.emoji}
                        I need ${customer.request.item}
                        — £${customer.request.price}
                    </span>

                    <button
                        class="serveBtn"
                        onclick="serveCustomer(${customer.id})">
                        SERVE CUSTOMER
                    </button>
                </div>
            `;

            customerPanel.appendChild(card);
        });
}

/* =========================================================
   SERVE CUSTOMER
   ========================================================= */

function serveCustomer(id){

    const customer =
        customers.find(c=>c.id===id);

    if(!customer || customer.served) return;

    customer.served = true;
    customer.state = "served";

    if(customer.speech){
        customer.speech.remove();
    }

    customer.element.classList.add("walking");

    showSpeech(
        customer,
        "Thank you! 😊",
        1800
    );

    setTimeout(()=>{

        const payment =
            customer.request.price +
            shopLevel;

        addMoney(
            payment,
            customer.x,
            customer.y
        );

        served++;

        customer.element.style.left = "105%";

        setTimeout(()=>{

            customer.element.remove();

            const index =
                customers.indexOf(customer);

            if(index >= 0){
                customers.splice(index,1);
            }

            updateCustomerPanel();

        },1000);

        updateCustomerPanel();

    },700);
}

/* =========================================================
   TALK TO NEAREST
   ========================================================= */

function talkToNearest(){

    const active =
        customers.filter(c=>!c.served);

    if(active.length===0){

        notify("There are no customers to talk to.");

        return;
    }

    const customer = active[0];

    const messages = [
        "Hello! 😊",
        "Welcome to The Last Shop!",
        "Let me know if you need anything.",
        "We have lots of products today!",
        "Thanks for coming to our shop!"
    ];

    showSpeech(
        customer,
        messages[
            Math.floor(Math.random()*messages.length)
        ]
    );
}

/* =========================================================
   MANUAL CUSTOMER
   ========================================================= */

function callCustomer(){

    if(!shopOpen){

        notify("The shop is closed.");

        return;
    }

    createCustomer();

    notify("A new customer is coming!");
}

/* =========================================================
   RESTOCK
   ========================================================= */

function restock(){

    const cost = 10;

    if(money < cost){

        notify("You need £10 to restock.");

        return;
    }

    money -= cost;

    updateHUD();

    notify("📦 Shop restocked!");

    /* little shelf animation */

    document.querySelectorAll(".item")
        .forEach(item=>{

            item.animate(
                [
                    {transform:"scale(1)"},
                    {transform:"scale(1.18)"},
                    {transform:"scale(1)"}
                ],
                {
                    duration:500
                }
            );
        });
}

/* =========================================================
   SHOP OPEN/CLOSE
   ========================================================= */

function openShop(){

    shopOpen = !shopOpen;

    if(shopOpen){

        notify("🚪 Shop is OPEN!");

    }else{

        notify("🔒 Shop is CLOSED!");
    }
}

/* =========================================================
   UPGRADES
   ========================================================= */

function upgradeShop(){

    const cost =
        50 * shopLevel;

    if(money < cost){

        notify("Not enough money.");

        return;
    }

    money -= cost;
    shopLevel++;

    notify(
        "⭐ Shop upgraded to level " +
        shopLevel
    );

    updateHUD();
}

function upgradeService(){

    const cost =
        40 * serviceLevel;

    if(money < cost){

        notify("Not enough money.");

        return;
    }

    money -= cost;
    serviceLevel++;

    notify(
        "⚡ Service upgraded to level " +
        serviceLevel
    );

    updateHUD();
}

function upgradeAttraction(){

    const cost =
        60 * attractionLevel;

    if(money < cost){

        notify("Not enough money.");

        return;
    }

    money -= cost;
    attractionLevel++;

    notify(
        "👥 More customers will visit!"
    );

    updateHUD();
}

/* =========================================================
   GAME CLOCK
   ========================================================= */

setInterval(()=>{

    if(paused) return;

    minute += 5;

    if(minute >= 60){

        minute = 0;
        hour++;
    }

    if(hour >= 18){

        endDay();
    }

    updateHUD();

},5000);

/* =========================================================
   CUSTOMER SPAWN
   ========================================================= */

setInterval(()=>{

    if(paused || !shopOpen) return;

    const chance =
        0.35 + attractionLevel * 0.08;

    if(Math.random() < chance){

        createCustomer();
    }

},4000);

/* =========================================================
   CONVERSATION TIMER
   ========================================================= */

setInterval(()=>{

    if(!paused){

        customerConversation();
    }

},8000);

/* =========================================================
   PAUSE
   ========================================================= */

function togglePause(){

    paused = !paused;

    document.getElementById("pauseBtn")
        .textContent = paused ? "▶" : "Ⅱ";

    notify(
        paused ?
        "⏸ Game paused" :
        "▶ Game resumed"
    );
}

/* =========================================================
   END DAY
   ========================================================= */

function endDay(){

    if(!shopOpen) return;

    shopOpen = false;

    document.getElementById("daySummary")
        .textContent =
        "Day " + day +
        " finished. You served " +
        served +
        " customers and have £" +
        Math.floor(money) +
        ".";

    document.getElementById("dayMessage")
        .style.display = "flex";
}

/* =========================================================
   NEXT DAY
   ========================================================= */

function nextDay(){

    day++;

    hour = 8;
    minute = 0;

    shopOpen = true;

    document.getElementById("dayMessage")
        .style.display = "none";

    notify(
        "🌅 Day " +
        day +
        " has started!"
    );

    updateHUD();

    setTimeout(createCustomer,1000);
    setTimeout(createCustomer,3000);
}

/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

const player =
    document.getElementById("player");

let playerX = 50;
let playerY = 68;

function movePlayer(dx,dy){

    playerX += dx;
    playerY += dy;

    playerX =
        Math.max(3,Math.min(94,playerX));

    playerY =
        Math.max(5,Math.min(82,playerY));

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";
}

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" || e.key==="a"){
        movePlayer(-2,0);
    }

    if(e.key==="ArrowRight" || e.key==="d"){
        movePlayer(2,0);
    }

    if(e.key==="ArrowUp" || e.key==="w"){
        movePlayer(0,-2);
    }

    if(e.key==="ArrowDown" || e.key==="s"){
        movePlayer(0,2);
    }

    if(e.key===" "){
        talkToNearest();
    }
});

/* =========================================================
   TOUCH / CLICK MOVEMENT
   ========================================================= */

document.getElementById("world")
.addEventListener("click",e=>{

    if(
        e.target.closest(".shelf") ||
        e.target.closest(".counter") ||
        e.target.closest(".speech")
    ){
        return;
    }

    const rect =
        document.getElementById("world")
        .getBoundingClientRect();

    const x =
        ((e.clientX-rect.left)/rect.width)*100;

    const y =
        ((e.clientY-rect.top)/rect.height)*100;

    playerX =
        Math.max(3,Math.min(94,x));

    playerY =
        Math.max(5,Math.min(82,y));

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";
});

/* =========================================================
   START GAME
   ========================================================= */

updateHUD();

setTimeout(()=>{
    createCustomer();
},1200);

setTimeout(()=>{
    createCustomer();
},3500);

setTimeout(()=>{
    createCustomer();
},6000);

notify("🏪 Welcome to The Last Shop!");

</script>
